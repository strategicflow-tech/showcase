<style>

.dot{width:12px;height:12px;border-radius:50%;}

.pb{background:#F7C1C1;color:#791F1F;}
.pa{background:#9FE1CB;color:#085041;}

.af-stat-n{font-family:"DM Serif Display",serif;font-size:22px;color:#E8003D;line-height:1;}

}

      <div style="flex:1;margin-left:8px;"><span id="pp" class="pill pb">Original Feature Release</span></div>
    </div>

    <!-- BEFORE -->
    <div class="panel active" id="panel-before">
      <div class="xnav">
        <div class="xlogo"><span class="xlogo-text">Xelix</span><div class="xlogo-dot"></div></div>
        <div class="xnav-links">
          <a href="#" class="xnav-link">Platform</a>
          <a href="#" class="xnav-link">Why Xelix</a>
          <a href="#" class="xnav-link">Resources</a>
          <a href="https://xelix.com/book-a-call" class="xnav-cta">Book a call</a>
        </div>
      </div>
      <div class="xhero">
        <div class="xhero-badge">Company News</div>
        <div class="xhero-h1">Feature release: Smarter triggers and touchless automation in Helpdesk</div>
        <div class="xhero-meta">Phil Watts · Co-Founder and CPO · May 2025</div>
      </div>
      <div class="xbody">
        <div class="xauthor">
          <div class="xavatar">PW</div>
          <div><div class="xauthor-name">Phil Watts</div><div class="xauthor-role">Co-Founder and CPO | Xelix</div></div>
        </div>
        <div class="xlead">Triggers, our latest release in Helpdesk, brings you even closer to a touchless vendor query management process. At Xelix, continuous improvement is at the core of what we do. Our mission is to build the future of Accounts Payable controls using agentic AI to power automation as a key part of that process.</div>
        <div class="xh2">What's new in Helpdesk?</div>
        <div class="xtext">Helpdesk is an Accounts Payable ticketing tool that understands vendor emails, creates tickets and generates AI responses to relieve your AP team of major inbox-stress. Now, we've expanded Helpdesk Triggers to support more complex workflows and deliver intelligent automation throughout the entire ticket lifecycle.</div>
        <ul class="xlist">
          <li class="xlist-item"><div class="xlist-dot"></div>Trigger workflows based on ticket updates, not just new tickets or messages received.</li>
          <li class="xlist-item"><div class="xlist-dot"></div>Use multiple conditions to control automation including vendor name, language, attachment type, ticket category and more.</li>
          <li class="xlist-item"><div class="xlist-dot"></div>Apply multiple actions within a single trigger: assign a ticket, forward to a mailbox, send a templated reply and update ticket fields.</li>
          <li class="xlist-item"><div class="xlist-dot"></div>Toggle triggers on or off without deleting them, ideal for testing, seasonal workflows or scheduling future automations.</li>
        </ul>
        <div class="xcta-box">
          <div class="xcta-text">Do you think an Accounts Payable helpdesk could make your life easier? Book a demo with our team today and take your first step towards calming the chaos.</div>
          <a href="https://xelix.com/enquiry-helpdesk" class="xcta-btn">Get in touch</a>
        </div>
      </div>
      <div class="xfoot">
        <div class="xlogo"><span style="font-size:14px;font-weight:800;color:#1a1a18;">Xelix</span><div style="width:6px;height:6px;border-radius:50%;background:#E8003D;margin-bottom:8px;margin-left:2px;"></div></div>
        <div class="xfoot-links">
          <a href="#" class="xfoot-link">Privacy Policy</a>
          <span class="xfoot-link">© 2025 Xelix</span>
        </div>
      </div>
      <div class="issues">
        <div class="issue"><span>&#9888;</span><span><strong>Filing Label Subject:</strong> "Feature release: Smarter triggers..." announces the category, not the AP reader's consequence. Folder tab.</span></div>
        <div class="issue"><span>&#9888;</span><span><strong>Feature-First Bias:</strong> Lead opens with what Xelix shipped. Reader's gain never stated in line one.</span></div>
        <div class="issue"><span>&#9888;</span><span><strong>Implied Transformation:</strong> "Even closer to touchless" is directional without a number. No before/after metric.</span></div>
        <div class="issue"><span>&#9888;</span><span><strong>Buried Proof:</strong> Specific use cases appear 4 paragraphs in. Most AP managers have stopped reading before they arrive.</span></div>
        <div class="issue"><span>&#9888;</span><span><strong>Guest Language CTA:</strong> "Get in touch" places the reader outside the action. No ownership of the outcome.</span></div>
      </div>
    </div>

    <!-- AFTER -->
    <div class="panel" id="panel-after">
      <div class="xnav">
        <div class="xlogo"><span class="xlogo-text">Xelix</span><div class="xlogo-dot"></div></div>
        <div class="xnav-links">
          <a href="#" class="xnav-link">Platform</a>
          <a href="#" class="xnav-link">Why Xelix</a>
          <a href="#" class="xnav-link">Resources</a>
          <a href="https://xelix.com/book-a-call" class="xnav-cta">Book a call</a>
        </div>
      </div>
      <div class="afhero">
        <div class="af-kicker">Helpdesk · Automation Update · May 2025</div>
        <div class="af-h1">Your AP team just stopped<br/>handling <em>vendor queries manually.</em></div>
        <div class="af-lead">Helpdesk Triggers now automates the full ticket lifecycle. Set conditions once. Let the system assign, respond, route and update without your team touching the queue.</div>
        <div class="af-stats">
          <div class="af-stat"><div class="af-stat-n">Full</div><div class="af-stat-l">Lifecycle automated</div></div>
          <div class="af-stat"><div class="af-stat-n">0</div><div class="af-stat-l">Manual forwards needed</div></div>
          <div class="af-stat"><div class="af-stat-n">1 step</div><div class="af-stat-l">Assign, reply, route, update</div></div>
        </div>
        <a href="https://xelix.com/enquiry-helpdesk" class="af-cta">See how it works for my team</a>
      </div>
      <div class="af-body">
        <div class="af-sec">
          <div class="af-sec-label">Before this release</div>
          <div class="af-sec-title">Triggers fired once. Everything in between was still manual.</div>
          <div class="af-sec-body">The original Triggers feature automated responses when a ticket was created or a new message arrived. Reassigning, routing, sending follow-ups, updating fields: all still required your team. Every one of those steps was time your AP team spent not doing anything more valuable.</div>
        </div>
        <div class="af-sec">
          <div class="af-sec-label">What changed</div>
          <div class="af-sec-title">Automation now runs the whole lifecycle without a manual touch.</div>
          <div class="af-sec-body">Triggers now fire on any ticket update. Multiple conditions filter precisely: vendor name, language, attachment type, category. A single trigger can assign, forward, reply, and update simultaneously. Toggle workflows on and off without deleting them. Your team sets the logic once.</div>
        </div>
        <div class="af-sec">
          <div class="af-sec-label">In practice</div>
          <div class="af-sec-title">Four workflows AP teams are already running.</div>
          <div class="af-sec-body">
            Vendors receive automatic acknowledgement with ticket number the moment a query lands.<br><br>
            Invoice and statement attachments route to the correct system based on attachment type.<br><br>
            Priority vendors are assigned to specific team members in one step, category and priority updated simultaneously.<br><br>
            Resolved tickets trigger automatic feedback requests without anyone on the team remembering to send them.
          </div>
        </div>
      </div>

        <span>Copyright 2025 Xelix</span>

        </div>
        <div class="ng">
          <div class="nc bad">
            <div class="nl bad">Before</div>
            <p><strong>Title:</strong> Feature release: Smarter triggers and touchless automation in Helpdesk<br><br>Filing Label Subject. Announces category and product name. Zero reader consequence. An AP manager sees this and has no reason to open it over anything else in the queue.</p>
          </div>
          <div class="nc good">
            <div class="nl good">After</div>
            <p><strong>Title:</strong> Your AP team just stopped handling vendor queries manually.<br><br>Consequence-first. Opens with what changed for the reader. Specific and credible. The feature is the mechanism, not the headline.</p>
          </div>
        </div>
        <div class="ut">The 5 upgrades and why they work</div>
        <div class="ui"><div class="un">01</div><div class="ut2">Subject: Filing Label to Consequence</div><div class="ub">"Feature release: Smarter triggers" describes what Xelix did. "Your AP team just stopped handling vendor queries manually" describes what changed for the reader. The subject line's job is not to categorize the email. It is to give the reader a reason to open it.</div></div>
        <div class="ui"><div class="un">02</div><div class="ut2">Lead: Feature announcement to Reader outcome</div><div class="ub">"Triggers, our latest release, brings you even closer to touchless" opens with Xelix as the actor. The rebuilt lead opens with the AP team's changed state. Every sentence of company context before the reader's outcome is a reader lost.</div></div>
        <div class="ui"><div class="un">03</div><div class="ut2">Transformation: Implied to Concrete</div><div class="ub">"Even closer to touchless" is directional without being measurable. The rebuilt stat cards show the outcome in concrete terms: full lifecycle automated, zero manual forwards, single-step multi-action triggers.</div></div>
        <div class="ui"><div class="un">04</div><div class="ut2">Proof: Buried to Structured</div><div class="ub">The original use cases appear after four paragraphs of feature description. The rebuilt version puts the four specific workflow examples in a dedicated section the reader reaches after the stats and CTA. Proof that is visible converts.</div></div>
        <div class="ui"><div class="un">05</div><div class="ut2">CTA: Guest Language to Ownership Language</div><div class="ub">"Get in touch" places the reader outside the action. "See how it works for my team" places the reader inside the action. Guest Language CTA appears in 96% of SaaS emails audited by Strategic Flow.</div></div>
        <div class="cn">
          <div class="cnt">This is the Strategic Flow method</div>
          <div class="cnb">Reader's outcome before company's announcement. Friction named in line one. Features organized by problem solved. Score: 3/10 to 9/10. Visit <a href="https://strategicflow.tech" style="color:var(--gm);text-decoration:underline;">strategicflow.tech</a> to audit your last feature release.</div>
        </div>
      </div>
    </div>

  </div>

<script>
function sp(id,btn){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tb").forEach(b=>b.classList.remove("active"));
  document.getElementById("panel-"+id).classList.add("active");
  btn.classList.add("active");
  var pp=document.getElementById("pp");
  var m={before:["pb","Original Feature Release"],after:["pa","Strategic Flow rewrite"],notes:["pn","Analysis"]};
  pp.className="pill "+m[id][0];pp.textContent=m[id][1];
}
</script>
