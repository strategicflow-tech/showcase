/* ===== NLP ===== */
{area:'nlp',id:'p-intro',
 title:L('NLP aici: o trusă pentru observarea tiparelor','NLP here: a toolkit for noticing patterns','PNL aquí: un kit para observar patrones'),
 html:L('<p>NLP (programare neuro-lingvistică) este un set de idei și tehnici despre cum se leagă limbajul, gândirea și comportamentul. Cea mai utilă idee practică este simplă: felul în care descrii o problemă modelează ce simți și ce faci mai departe.</p><p>Dovezile pentru NLP ca tratament sunt limitate, iar acest instrument nu pretinde că tratează nimic. Împrumută partea utilă: observi tiparele din propriile cuvinte, pui întrebări precise și testezi schimbări mici.</p>','<p>NLP (neuro-linguistic programming) is a set of ideas and techniques about how language, thought and behavior connect. Its best practical idea is simple: the way you describe a problem shapes what you feel and what you do next.</p><p>The evidence for NLP as a treatment is limited, and this tool does not claim to treat anything. It borrows the useful part: noticing patterns in your own words, asking precise questions and testing small changes.</p>','<p>La PNL (programación neurolingüística) es un conjunto de ideas y técnicas sobre cómo se conectan el lenguaje, el pensamiento y la conducta. Su idea práctica más útil es simple: la forma en que describes un problema moldea lo que sientes y lo que haces después.</p><p>La evidencia de la PNL como tratamiento es limitada, y esta herramienta no pretende tratar nada. Toma prestada la parte útil: observar patrones en tus propias palabras, hacer preguntas precisas y probar cambios pequeños.</p>')},
{area:'nlp',id:'p-loop',
 title:L('Anatomia unui tipar','Anatomy of a pattern','Anatomía de un patrón'),
 html:L('<p>Orice tipar are aceleași părți, într-o buclă:</p><ol><li><b>Declanșator:</b> ce se întâmplă (un mesaj, un loc, un ton).</li><li><b>Sens:</b> ce îți spui că înseamnă.</li><li><b>Stare:</b> ce simți în corp și în minte.</li><li><b>Acțiune:</b> ce faci sau ce eviți.</li><li><b>Beneficiu și cost:</b> ce îți dă acum (alinare, siguranță) și ce te costă mai târziu.</li></ol><p>Schimbarea începe de obicei la sens sau la acțiune, nu la declanșator, pentru că declanșatorul nu îl controlezi.</p>','<p>Every pattern has the same parts, in a loop:</p><ol><li><b>Trigger:</b> what happens (a message, a place, a tone).</li><li><b>Meaning:</b> what you tell yourself it means.</li><li><b>State:</b> what you feel in body and mind.</li><li><b>Action:</b> what you do or avoid.</li><li><b>Payoff and cost:</b> what it gives you now (relief, safety) and what it costs later.</li></ol><p>Change usually starts at the meaning or the action, not at the trigger, because you cannot control the trigger.</p>','<p>Todo patrón tiene las mismas partes, en un bucle:</p><ol><li><b>Detonante:</b> qué ocurre (un mensaje, un lugar, un tono).</li><li><b>Significado:</b> lo que te dices que significa.</li><li><b>Estado:</b> lo que sientes en el cuerpo y la mente.</li><li><b>Acción:</b> lo que haces o evitas.</li><li><b>Beneficio y costo:</b> lo que te da ahora (alivio, seguridad) y lo que te cuesta después.</li></ol><p>El cambio suele empezar en el significado o en la acción, no en el detonante, porque el detonante no lo controlas.</p>')},
{area:'nlp',id:'p-lang',
 title:L('Tipare de limbaj care ascund reguli','Language patterns that hide rules','Patrones de lenguaje que esconden reglas'),
 html:L('<p>Anumite cuvinte dezvăluie reguli. Aceste șapte tipare sunt inspirate de Meta-Modelul din NLP, iar detectorul de mai jos le marchează în textul tău. Fiecare vine cu întrebări care readuc detaliile.</p><div data-tool="lingtable"></div>','<p>Certain words reveal rules. These seven patterns are inspired by the NLP Meta-Model, and the finder below marks them in your text. Each comes with questions that restore the detail.</p><div data-tool="lingtable"></div>','<p>Ciertas palabras revelan reglas. Estos siete patrones se inspiran en el Metamodelo de la PNL y el detector de abajo los marca en tu texto. Cada uno viene con preguntas que devuelven el detalle.</p><div data-tool="lingtable"></div>')},
{area:'nlp',id:'p-sflow',
 title:L('Metoda SFLOW în cinci pași','The SFLOW method in five steps','El método SFLOW en cinco pasos'),
 html:L('<ol class="steps"><li><b>S: Spot (Observă).</b> Descrie un episod concret, nu toată viața.</li><li><b>F: Frame (Încadrează).</b> Marchează absolutele, „trebuie”-urile, etichetele. Pune întrebările de precizie.</li><li><b>L: Locate (Localizează).</b> Ce declanșează tiparul și de ce te protejează?</li><li><b>O: Options (Opțiuni).</b> Scrie două răspunsuri alternative și alege-l pe cel mai mic.</li><li><b>W: Walk (Pași).</b> Testează răspunsul mic în viața reală o săptămână și revizuiește rezultatul.</li></ol>','<ol class="steps"><li><b>S: Spot.</b> Describe one concrete episode, not your whole life.</li><li><b>F: Frame.</b> Mark the absolutes, the "musts", the labels. Ask the precision questions.</li><li><b>L: Locate.</b> What starts the pattern, and what does it protect you from?</li><li><b>O: Options.</b> Write two alternative responses and choose the smaller one.</li><li><b>W: Walk.</b> Test the small response in real life for a week and review the result.</li></ol>','<ol class="steps"><li><b>S: Spot (Observa).</b> Describe un episodio concreto, no toda tu vida.</li><li><b>F: Frame (Encuadra).</b> Marca los absolutos, los "debo", las etiquetas. Haz las preguntas de precisión.</li><li><b>L: Locate (Localiza).</b> ¿Qué dispara el patrón y de qué te protege?</li><li><b>O: Options (Opciones).</b> Escribe dos respuestas alternativas y elige la más pequeña.</li><li><b>W: Walk (Camina).</b> Prueba la respuesta pequeña en la vida real durante una semana y revisa el resultado.</li></ol>')},
{area:'nlp',id:'p-find',
 title:L('Detectorul de tipare','The pattern finder','El detector de patrones'),
 html:L('<p>Scrie sau lipește o situație. Detectorul recunoaște cuvinte cheie în română, engleză și spaniolă, marchează tiparele de limbaj și îți arată temele cu semnalul cel mai puternic, cu accentul și cursul de 7 zile.</p><div data-tool="finder"></div>','<p>Type or paste a situation. The finder recognizes keywords in Romanian, English and Spanish, marks language patterns and shows the themes with the strongest signal, with the focus and the 7-day course.</p><div data-tool="finder"></div>','<p>Escribe o situación o pégala. El detector reconoce palabras clave en rumano, inglés y español, marca los patrones de lenguaje y muestra los temas con la señal más fuerte, con el énfasis y el curso de 7 días.</p><div data-tool="finder"></div>')},
{area:'nlp',id:'p-themes',
 title:L('Douăsprezece tipare frecvente','Twelve common patterns','Doce patrones frecuentes'),
 html:L('<p>Deschide oricare temă ca să vezi accentul, întrebările și cursul de 7 zile.</p><div data-tool="themelib"></div>','<p>Open any theme to see the focus, the questions and the 7-day course.</p><div data-tool="themelib"></div>','<p>Abre cualquier tema para ver el énfasis, las preguntas y el curso de 7 días.</p><div data-tool="themelib"></div>')},
{area:'nlp',id:'p-tech',
 title:L('Tehnici pe care le poți folosi singur','Techniques you can use on your own','Técnicas que puedes usar por tu cuenta'),
 html:L('<h3>Întrebări de precizie</h3><p>Transformă afirmațiile vagi în concrete: „Cine, mai precis? Când? Comparat cu ce?”</p><h3>Reformulare</h3><p>Caută o a doua interpretare care se potrivește cu aceleași fapte. Nu reformula un rău ca pe un beneficiu.</p><h3>Repetiție mentală</h3><p>Imaginează-te folosind noul răspuns în următoarea situație obișnuită, apoi fă-o în realitate.</p><h3>Ancorare (varianta ușoară)</h3><p>Asociază un gest mic cu o amintire calmă și verifică dacă te ajută să te pregătești. Dovezile pentru efecte NLP specifice sunt slabe, așa că judecă după rezultatele tale.</p><h3>Nu pentru uz solitar</h3><p>Tehnici care revin asupra amintirilor dureroase (swish, linia timpului și altele asemănătoare) se fac doar cu un specialist calificat.</p>','<h3>Precision questions</h3><p>Turn vague statements into concrete ones: "Who in particular? When? Compared with what?"</p><h3>Reframing</h3><p>Look for a second interpretation that fits the same facts. Do not reframe harm as a benefit.</p><h3>Future pacing</h3><p>Picture yourself using the new response in the next ordinary situation, then do it for real.</p><h3>Anchoring (light version)</h3><p>Pair a small gesture with a calm memory and check whether it helps you prepare. Evidence for specific NLP effects is weak, so judge by your own results.</p><h3>Not for solo use</h3><p>Techniques that revisit painful memories (swish, timeline and similar) should be done only with a qualified professional.</p>','<h3>Preguntas de precisión</h3><p>Convierte las afirmaciones vagas en concretas: "¿Quién en particular? ¿Cuándo? ¿Comparado con qué?"</p><h3>Reformulación</h3><p>Busca una segunda interpretación que encaje con los mismos hechos. No reformules un daño como un beneficio.</p><h3>Ensayo mental</h3><p>Imagínate usando la nueva respuesta en la próxima situación ordinaria y luego hazlo de verdad.</p><h3>Anclaje (versión ligera)</h3><p>Asocia un gesto pequeño con un recuerdo tranquilo y comprueba si te ayuda a prepararte. La evidencia de efectos específicos de la PNL es débil, así que juzga por tus propios resultados.</p><h3>No para uso en solitario</h3><p>Las técnicas que revisitan recuerdos dolorosos (swish, línea del tiempo y similares) se hacen solo con un profesional cualificado.</p>')},
{area:'nlp',id:'p-safe',
 title:L('Siguranță și sprijin profesional','Safety and professional support','Seguridad y apoyo profesional'),
 html:L('<div class="how"><b>Oprește exercițiile și cere sprijin</b> dacă ai flashbackuri, disociere, coșmaruri persistente, panică severă, gânduri de a-ți face rău sau dificultăți mari de funcționare. Un psiholog clinician sau psihoterapeut cu experiență în traumă te poate însoți.</div><p>Ghidurile clinice (de exemplu NICE pentru PTSD) recomandă terapii psihologice focalizate pe traumă, nu exerciții făcute singur.</p><p>Pentru urgențe sună la 112. În Spania, linia 024 oferă sprijin persoanelor care se gândesc la suicid, gratuit, 24 de ore.</p><p>Dacă folosești instrumentul cu alte persoane, obține acordul lor și nu-l prezenta ca terapie.</p>','<div class="how"><b>Stop the exercises and ask for support</b> if you have flashbacks, dissociation, persistent nightmares, severe panic, thoughts of harming yourself or major difficulty functioning. A clinical psychologist or psychotherapist experienced in trauma can accompany you.</div><p>Clinical guidelines (for example NICE for PTSD) recommend trauma-focused psychological therapies, not exercises done alone.</p><p>In an emergency call 112. In Spain, the 024 line supports people thinking about suicide, free, 24 hours.</p><p>If you use the tool with other people, get their consent and do not present it as therapy.</p>','<div class="how"><b>Detén los ejercicios y pide apoyo</b> si tienes flashbacks, disociación, pesadillas persistentes, pánico intenso, pensamientos de hacerte daño o grandes dificultades para funcionar. Un psicólogo clínico o psicoterapeuta con experiencia en trauma puede acompañarte.</div><p>Las guías clínicas (por ejemplo NICE para el TEPT) recomiendan terapias psicológicas centradas en el trauma, no ejercicios hechos a solas.</p><p>En una emergencia llama al 112. En España, la línea 024 atiende a personas que piensan en el suicidio, gratuita, 24 horas.</p><p>Si usas la herramienta con otras personas, obtén su consentimiento y no la presentes como terapia.</p>')},
{area:'nlp',id:'p-deep',
 title:L('NLP Deep (pachet)','NLP Deep (package)','PNL Deep (paquete)'),
 html:L('<p>Program de 21 de zile pe temă, bancă de întrebări de precizie și jurnalul tiparelor.</p><div data-tool="nlpdeep"></div>','<p>A 21-day program for each theme, a precision question bank and the pattern journal.</p><div data-tool="nlpdeep"></div>','<p>Un programa de 21 días por tema, un banco de preguntas de precisión y el diario de patrones.</p><div data-tool="nlpdeep"></div>')},

/* ===== CROSS ===== */
{area:'cross',id:'c-why',
 title:L('De ce le încrucișăm','Why cross the two','Por qué cruzarlos'),
 html:L('<p>Numerele și cuvintele răspund la întrebări diferite. Numerele descriu o tendință simbolică: o temă către care poți reveni. Cuvintele descriu un tipar pe care îl poți observa chiar acum. Încrucișate, dau trei lecturi utile:</p><ul><li><b>Rezonanță:</b> cuvintele și numerele indică aceeași temă. Merită testată prima.</li><li><b>Temă situațională:</b> apare în cuvinte, dar nu în numere. Ține probabil de o perioadă, nu de temperament.</li><li><b>Punct orb posibil:</b> numerele sugerează o temă pe care cuvintele nu o menționează. Verifică-l cu blândețe.</li></ul><p>Reține limita: legătura dintre un număr și o temă este o ipoteză a acestui instrument, nu o regulă demonstrată.</p>','<p>Numbers and words answer different questions. Numbers describe a symbolic tendency: a theme you may return to. Words describe a pattern you can observe right now. Crossed, they give three useful readings:</p><ul><li><b>Resonance:</b> words and numbers point to the same theme. Worth testing first.</li><li><b>Situational theme:</b> it shows in the words but not in the numbers. Likely tied to a period, not to temperament.</li><li><b>Possible blind spot:</b> the numbers suggest a theme the words do not mention. Check it gently.</li></ul><p>Remember the limit: the link between a number and a theme is a hypothesis of this tool, not a proven rule.</p>','<p>Los números y las palabras responden a preguntas distintas. Los números describen una tendencia simbólica: un tema al que puedes volver. Las palabras describen un patrón que puedes observar ahora mismo. Cruzados, dan tres lecturas útiles:</p><ul><li><b>Resonancia:</b> palabras y números apuntan al mismo tema. Merece probarse primero.</li><li><b>Tema situacional:</b> aparece en las palabras pero no en los números. Probablemente ligado a un periodo, no al temperamento.</li><li><b>Posible punto ciego:</b> los números sugieren un tema que las palabras no mencionan. Compruébalo con suavidad.</li></ul><p>Recuerda el límite: el vínculo entre un número y un tema es una hipótesis de esta herramienta, no una regla demostrada.</p>')},
{area:'cross',id:'c-tool',
 title:L('Generează profilul încrucișat','Generate the cross profile','Genera el perfil cruzado'),
 html:L('<p>Completează ce vrei: data nașterii, numele și textul. Cu toate trei, profilul este complet.</p><div data-tool="cross"></div>','<p>Fill in what you want: birth date, name and text. With all three, the profile is complete.</p><div data-tool="cross"></div>','<p>Completa lo que quieras: fecha de nacimiento, nombre y texto. Con los tres, el perfil es completo.</p><div data-tool="cross"></div>')},
{area:'cross',id:'c-read',
 title:L('Cum citești profilul','How to read the profile','Cómo leer el perfil'),
 html:L('<ol><li>Începe cu rezonanțele: acolo ipoteza are cel mai mult suport în ambele surse.</li><li>Citește momentul potrivit: ritmul anului îți spune dacă e un timp bun pentru efort mare sau pentru pași mici.</li><li>Rulează doar săptămâna 1. Nu planifica luna întreagă înainte să vezi ce observi.</li><li>Revino după 4 săptămâni și compară cu notele tale.</li><li>Nu face profilul altor persoane fără acordul lor și nu lua decizii despre ele pe baza lui.</li></ol>','<ol><li>Start with the resonances: there the hypothesis has support from both sources.</li><li>Read the timing: the rhythm of the year tells you whether it is a time for big effort or for small steps.</li><li>Run only week 1. Do not plan the whole month before you see what you notice.</li><li>Return after 4 weeks and compare with your notes.</li><li>Do not profile other people without their consent, and do not make decisions about them based on it.</li></ol>','<ol><li>Empieza por las resonancias: ahí la hipótesis tiene apoyo de ambas fuentes.</li><li>Lee el momento oportuno: el ritmo del año te dice si es un tiempo de gran esfuerzo o de pasos pequeños.</li><li>Haz solo la semana 1. No planees todo el mes antes de ver qué observas.</li><li>Vuelve a las 4 semanas y compara con tus notas.</li><li>No hagas el perfil de otras personas sin su consentimiento ni tomes decisiones sobre ellas a partir de él.</li></ol>')},
{area:'cross',id:'c-pro',
 title:L('Raport complet pentru consultații (pachet)','Full report for consultations (package)','Informe completo para consultas (paquete)'),
 html:L('<p>Raport profesional cu numele clientului, notele consultantului, toate numerele, analiza încrucișată și planul, gata de tipărit sau de descărcat.</p><div data-tool="crosspro"></div>','<p>A professional report with the client name, consultant notes, all numbers, the cross analysis and the plan, ready to print or download.</p><div data-tool="crosspro"></div>','<p>Un informe profesional con el nombre del cliente, las notas del consultor, todos los números, el análisis cruzado y el plan, listo para imprimir o descargar.</p><div data-tool="crosspro"></div>')}
];

add('start','s-what',L('Ce este și ce primești','What it is and what you get','Qué es y qué obtienes'),L(
'<p><b>Strategic Flow Numerology &amp; NLP</b> este un instrument de reflecție personală care pune față în față două lucruri rar combinate: numerologia simbolică (ce sugerează data nașterii și numele tău) și analiza limbajului inspirată din NLP (ce arată felul în care îți descrii singur situația).</p><p>Scrii liber ce trăiești, cu propriile cuvinte. Aplicația citește tonul, zonele de viață și cuvintele tale, îți arată tiparele probabile, le compară cu numerele tale și îți propune un curs scurt de urmat, cu întrebări și experimente mici.</p><ul><li>Funcționează în română, engleză și spaniolă.</li><li>Funcționează și fără internet.</li><li>Versiunea rapidă este gratuită; pachetele adaugă adâncime și evoluție în timp.</li></ul>',
'<p><b>Strategic Flow Numerology &amp; NLP</b> is a personal-reflection tool that sets two rarely combined things side by side: symbolic numerology (what your birth date and name suggest) and NLP-inspired language analysis (what the way you describe your own situation shows).</p><p>You write freely what you are living, in your own words. The app reads the tone, the areas of life and your words, shows the likely patterns, compares them with your numbers and offers a short course to follow, with questions and small experiments.</p><ul><li>It works in Romanian, English and Spanish.</li><li>It also works without internet.</li><li>The quick version is free; the packages add depth and evolution over time.</li></ul>',
'<p><b>Strategic Flow Numerology &amp; NLP</b> es una herramienta de reflexión personal que pone frente a frente dos cosas rara vez combinadas: la numerología simbólica (lo que sugieren tu fecha de nacimiento y tu nombre) y el análisis del lenguaje inspirado en la PNL (lo que muestra cómo describes tú mismo tu situación).</p><p>Escribes libremente lo que vives, con tus palabras. La aplicación lee el tono, las áreas de la vida y tus palabras, muestra los patrones probables, los compara con tus números y propone un curso breve que seguir, con preguntas y pequeños experimentos.</p><ul><li>Funciona en rumano, inglés y español.</li><li>También funciona sin internet.</li><li>La versión rápida es gratuita; los paquetes añaden profundidad y evolución en el tiempo.</li></ul>'));

add('start','s-how',L('Cum îl folosești, în 3 pași','How to use it, in 3 steps','Cómo usarlo, en 3 pasos'),L(
'<ol class="steps"><li><b>Creează-ți profilul gratuit.</b> Numele, data nașterii și, dacă vrei, e-mailul. Se salvează doar pe dispozitivul tău, ca să nu le rescrii. Mergi la <a href="#/me">Contul meu</a>.</li><li><b>Citește-te din două părți.</b> În <a href="#/cross">Profil încrucișat</a> scrii câteva rânduri despre ce trăiești și vezi numerele, tiparele și întrebările tale. Nu ai nevoie de cuvinte anume.</li><li><b>Urmărește evoluția.</b> Fă un check-in scurt când vrei. În pachetele plătite, aplicația îți arată graficul, etapa în care te afli și acțiunile noi potrivite etapei.</li></ol><p>Dacă un termen nu îți e clar, apasă pe el: se deschide <a href="#/gloss">Glosarul</a>, iar butonul „Înapoi la ce citeai” te readuce exact unde erai.</p>',
'<ol class="steps"><li><b>Create your free profile.</b> Your name, birth date and, if you wish, your e-mail. It is saved only on your device, so you do not retype it. Go to <a href="#/me">My profile</a>.</li><li><b>Read yourself from two sides.</b> In <a href="#/cross">Cross profile</a> you write a few lines about what you are living and see your numbers, patterns and questions. You do not need specific words.</li><li><b>Follow your evolution.</b> Make a short check-in whenever you like. In the paid packages, the app shows your chart, the stage you are in and the new actions that suit that stage.</li></ol><p>If a term is unclear, tap it: the <a href="#/gloss">Glossary</a> opens, and the "Back to what you were reading" button takes you right back to where you were.</p>',
'<ol class="steps"><li><b>Crea tu perfil gratuito.</b> Tu nombre, tu fecha de nacimiento y, si quieres, tu correo. Se guarda solo en tu dispositivo, para que no lo reescribas. Ve a <a href="#/me">Mi perfil</a>.</li><li><b>Léete desde dos lados.</b> En <a href="#/cross">Perfil cruzado</a> escribes unas líneas sobre lo que vives y ves tus números, patrones y preguntas. No necesitas palabras concretas.</li><li><b>Sigue tu evolución.</b> Haz un check-in breve cuando quieras. En los paquetes de pago, la aplicación te muestra el gráfico, la etapa en que estás y las acciones nuevas que corresponden a esa etapa.</li></ol><p>Si un término no te queda claro, púlsalo: se abre el <a href="#/gloss">Glosario</a>, y el botón "Volver a lo que leías" te devuelve justo a donde estabas.</p>'));

add('start','s-for',L('Pentru cine este și pentru cine nu','Who it is for and who it is not for','Para quién es y para quién no'),L(
'<p><b>Este pentru tine dacă</b> vrei să-ți clarifici o perioadă, să observi ce se repetă în felul în care gândești, să-ți pui întrebări mai bune sau să lucrezi ca consultant, coach sau trainer cu o structură clară și un raport pentru client.</p><p><b>Nu este pentru</b> diagnostic, tratament sau terapie, nu înlocuiește un medic ori un psiholog și nu prezice viitorul. Numerologia este un sistem simbolic fără validare științifică, iar dovezile pentru NLP sunt limitate. De aceea totul este formulat ca ipoteză de verificat în viața ta.</p><p>Aplicația este destinată persoanelor de cel puțin 18 ani.</p>',
'<p><b>It is for you if</b> you want to clarify a period, notice what repeats in the way you think, ask yourself better questions, or work as a consultant, coach or trainer with a clear structure and a client report.</p><p><b>It is not for</b> diagnosis, treatment or therapy, it does not replace a doctor or a psychologist and it does not predict the future. Numerology is a symbolic system with no scientific validation, and the evidence for NLP is limited. That is why everything is worded as a hypothesis to check in your own life.</p><p>The app is intended for people aged 18 or over.</p>',
'<p><b>Es para ti si</b> quieres aclarar un periodo, notar qué se repite en tu forma de pensar, hacerte mejores preguntas o trabajar como consultor, coach o formador con una estructura clara y un informe para el cliente.</p><p><b>No es para</b> diagnóstico, tratamiento o terapia, no sustituye a un médico ni a un psicólogo y no predice el futuro. La numerología es un sistema simbólico sin validación científica y la evidencia sobre la PNL es limitada. Por eso todo se formula como una hipótesis para comprobar en tu propia vida.</p><p>La aplicación está pensada para personas de 18 años o más.</p>'));

add('start','s-plans',L('Ce primești gratuit și ce primești în pachete','What is free and what the packages add','Qué es gratis y qué añaden los paquetes'),L(
'<p>Versiunea gratuită rămâne la îndemâna oricui. Pachetele se plătesc o singură dată (nu sunt abonamente) și adaugă adâncime și evoluție în timp. Mai jos vezi, rând cu rând, ce conține fiecare plan.</p><div data-tool="plans"></div><p class="muted small">Prețurile finale, cu impozitele aplicabile, sunt cele afișate în pagina de plată. Detalii în <a href="#/terms">Termeni și condiții</a>.</p>',
'<p>The free version stays available to anyone. Packages are paid once (they are not subscriptions) and add depth and evolution over time. Below you can see, row by row, what each plan contains.</p><div data-tool="plans"></div><p class="muted small">Final prices, with applicable taxes, are those shown on the payment page. Details in the <a href="#/terms">Terms and Conditions</a>.</p>',
'<p>La versión gratuita sigue al alcance de cualquiera. Los paquetes se pagan una sola vez (no son suscripciones) y añaden profundidad y evolución en el tiempo. Abajo ves, fila por fila, qué contiene cada plan.</p><div data-tool="plans"></div><p class="muted small">Los precios finales, con los impuestos aplicables, son los que se muestran en la página de pago. Detalles en los <a href="#/terms">Términos y condiciones</a>.</p>'));

add('start','s-data',L('Datele tale','Your data','Tus datos'),L(
'<p>Numele, data nașterii, textele tale, check-in-urile și jurnalul rămân în browserul tău. Nu sunt trimise către un server. Dacă îți creezi un profil, el se salvează doar pe acest dispozitiv, iar tu îl poți exporta într-un fișier și îl poți șterge oricând.</p><p>Singura excepție este adresa de e-mail, și doar dacă o introduci și bifezi consimțământul: atunci trimitem doar e-mailul, limba, versiunea termenilor și data consimțământului. Data nașterii și textele tale nu se trimit niciodată.</p>',
'<p>Your name, birth date, texts, check-ins and journal stay in your browser. They are not sent to a server. If you create a profile, it is saved only on this device, and you can export it to a file and delete it at any time.</p><p>The only exception is your e-mail address, and only if you enter it and tick the consent: then we send only the e-mail, the language, the terms version and the consent date. Your birth date and your texts are never sent.</p>',
'<p>Tu nombre, fecha de nacimiento, textos, check-ins y diario permanecen en tu navegador. No se envían a ningún servidor. Si creas un perfil, se guarda solo en este dispositivo y puedes exportarlo a un archivo y borrarlo en cualquier momento.</p><p>La única excepción es tu dirección de correo, y solo si la introduces y marcas el consentimiento: entonces enviamos solo el correo, el idioma, la versión de los términos y la fecha del consentimiento. Tu fecha de nacimiento y tus textos nunca se envían.</p>'));

add('start','s-safe',L('Siguranță și limite','Safety and limits','Seguridad y límites'),L(
'<p>Dacă textul tău conține cuvinte despre a-ți face rău sau a nu mai vrea să trăiești, aplicația nu îți dă niciun plan, ci te îndrumă spre ajutor: în Spania, <b>112</b> pentru urgențe și <b>024</b> pentru linia de prevenție a suicidului. Pentru abuz, violență sau traumă, recomandă un specialist.</p><p>Dacă o stare de apăsare ține de mai mult de două săptămâni sau îți afectează somnul, mâncatul ori munca, vorbește cu medicul de familie sau cu un psiholog. Aplicația este un instrument de reflecție, nu un înlocuitor al ajutorului profesionist.</p>',
'<p>If your text contains words about hurting yourself or no longer wanting to live, the app gives you no plan and points you to help instead: in Spain, <b>112</b> for emergencies and <b>024</b> for the suicide-prevention line. For abuse, violence or trauma, it recommends a professional.</p><p>If a heavy mood lasts more than two weeks or affects your sleep, eating or work, talk to your family doctor or a psychologist. The app is a reflection tool, not a substitute for professional help.</p>',
'<p>Si tu texto contiene palabras sobre hacerte daño o no querer vivir, la aplicación no te da ningún plan y te orienta hacia ayuda: en España, <b>112</b> para emergencias y <b>024</b> para la línea de prevención del suicidio. Para abuso, violencia o trauma, recomienda acudir a un profesional.</p><p>Si un ánimo pesado dura más de dos semanas o afecta tu sueño, tu alimentación o tu trabajo, habla con tu médico de familia o un psicólogo. La aplicación es una herramienta de reflexión, no un sustituto de la ayuda profesional.</p>'));

'<p><a class="btn" href="#/gloss">Deschide glosarul</a> <a class="btn" href="#/terms">Termeni și condiții</a></p>',
'<p><a class="btn" href="#/gloss">Open the glossary</a> <a class="btn" href="#/terms">Terms and Conditions</a></p>',

'<p>Un check-in durează două minute. Din ele se vede cum se mișcă starea ta și în ce etapă a programului te afli. Acțiunile propuse se schimbă odată cu etapa.</p><div data-tool="evonlp"></div>',

'<p>Previziunile sunt simbolice: teme de planificare derivate din numerele tale, nu predicții de evenimente. Notează la sfârșitul fiecărei luni cum a fost, iar după câteva luni vezi ce numere ți se potrivesc.</p><div data-tool="numevo"></div>',

t('t-1',['1. Cine suntem și ce reglementează acești Termeni','1. Who we are and what these Terms govern','1. Quiénes somos y qué regulan estos Términos'],
'<p>Acești Termeni și condiții (denumiți în continuare „Termenii”) reglementează folosirea aplicației web „Strategic Flow Numerology &amp; NLP” (denumită „Aplicația”) și cumpărarea pachetelor suplimentare de conținut digital (denumite „Pachete”).</p><p>Aplicația și Pachetele sunt furnizate de {{seller}}, persoană fizică autorizată ca lucrător pe cont propriu (autónomo), cu denumirea comercială {{trade}}, NIF/NIE {{nif}}, cu sediul în {{addr}}, e-mail de contact {{mail}} (denumit în continuare „Vânzătorul”).</p><p>Pentru profilul salvat, pentru adresa de e-mail și pentru activarea unui Pachet, acceptarea Termenilor se face prin bifarea căsuței dedicate. Dacă nu ești de acord cu Termenii, te rugăm să nu creezi un profil și să nu cumperi un Pachet.</p>',
'<p>These Terms and Conditions (the "Terms") govern the use of the web application "Strategic Flow Numerology &amp; NLP" (the "App") and the purchase of additional digital-content packages (the "Packages").</p><p>The App and the Packages are provided by {{seller}}, a natural person registered as a self-employed worker (autónomo), trading as {{trade}}, NIF/NIE {{nif}}, with a registered address at {{addr}}, contact e-mail {{mail}} (the "Seller").</p><p>For the saved profile, for the e-mail address and for the activation of a Package, acceptance of the Terms is given by ticking the dedicated box. If you do not agree with the Terms, please do not create a profile and do not buy a Package.</p>',
'<p>Estos Términos y condiciones (los "Términos") regulan el uso de la aplicación web "Strategic Flow Numerology &amp; NLP" (la "Aplicación") y la compra de paquetes adicionales de contenido digital (los "Paquetes").</p><p>La Aplicación y los Paquetes son proporcionados por {{seller}}, persona física dada de alta como trabajador autónomo, con nombre comercial {{trade}}, NIF/NIE {{nif}}, con domicilio en {{addr}}, correo de contacto {{mail}} (el "Vendedor").</p><p>Para el perfil guardado, para la dirección de correo y para la activación de un Paquete, la aceptación de los Términos se presta marcando la casilla correspondiente. Si no estás de acuerdo con los Términos, por favor no crees un perfil ni compres un Paquete.</p>');

t('t-2',['2. Ce este Aplicația și ce nu este','2. What the App is and is not','2. Qué es la Aplicación y qué no es'],
'<p>Aplicația este un instrument educațional de reflecție personală, disponibil în română, engleză și spaniolă. Combină un calcul de numerologie simbolică (sistem pitagoreic) cu o analiză a limbajului inspirată din NLP și propune întrebări, exerciții și planuri scurte.</p><p>Numerologia este un sistem simbolic fără validare științifică, iar dovezile privind eficiența NLP sunt limitate. Rezultatele sunt ipoteze de reflecție, nu fapte, și nu prezic viitorul.</p><p>Aplicația nu oferă diagnostic, tratament, terapie, consiliere psihologică sau medicală, sfaturi juridice, financiare ori de investiții și nu înlocuiește un medic, un psiholog sau un psihoterapeut.</p><p>Dacă te confrunți cu o stare de apăsare care durează, cu gânduri de a-ți face rău sau cu o situație de criză, cere ajutor specializat. În Spania, sună la 112 pentru urgențe sau la 024 pentru linia de prevenție a suicidului; în alte țări, apelează numărul local de urgență.</p>',
'<p>The App is an educational tool for personal reflection, available in Romanian, English and Spanish. It combines a symbolic numerology calculation (Pythagorean system) with a language analysis inspired by NLP and offers questions, exercises and short plans.</p><p>Numerology is a symbolic system with no scientific validation, and the evidence for the effectiveness of NLP is limited. The results are hypotheses for reflection, not facts, and they do not predict the future.</p><p>The App does not provide diagnosis, treatment, therapy, psychological or medical counselling, or legal, financial or investment advice, and it does not replace a doctor, a psychologist or a psychotherapist.</p><p>If you are facing a persistent low mood, thoughts of harming yourself or a crisis, ask for specialist help. In Spain, call 112 for emergencies or 024 for the suicide-prevention line; elsewhere, call your local emergency number.</p>',
'<p>La Aplicación es una herramienta educativa de reflexión personal, disponible en rumano, inglés y español. Combina un cálculo de numerología simbólica (sistema pitagórico) con un análisis del lenguaje inspirado en la PNL y ofrece preguntas, ejercicios y planes breves.</p><p>La numerología es un sistema simbólico sin validación científica y la evidencia sobre la eficacia de la PNL es limitada. Los resultados son hipótesis de reflexión, no hechos, y no predicen el futuro.</p><p>La Aplicación no ofrece diagnóstico, tratamiento, terapia, asesoramiento psicológico o médico, ni asesoramiento jurídico, financiero o de inversión, y no sustituye a un médico, un psicólogo o un psicoterapeuta.</p><p>Si atraviesas un estado de ánimo bajo que se prolonga, tienes pensamientos de hacerte daño o te encuentras en una crisis, pide ayuda especializada. En España, llama al 112 para emergencias o al 024 para la línea de prevención del suicidio; en otros países, llama al número local de emergencias.</p>');

t('t-3',['3. Cine poate folosi Aplicația','3. Who may use the App','3. Quién puede usar la Aplicación'],
'<p>Aplicația este destinată persoanelor care au cel puțin 18 ani și capacitatea de a încheia contracte. Dacă ești minor, o poți folosi doar împreună cu un părinte sau un tutore, iar cumpărarea unui Pachet o poate face numai un adult.</p>',
'<p>The App is intended for people who are at least 18 years old and have the capacity to enter into contracts. If you are a minor, you may use it only together with a parent or guardian, and only an adult may buy a Package.</p>',
'<p>La Aplicación está destinada a personas que tengan al menos 18 años y capacidad para contratar. Si eres menor, solo puedes usarla junto con un progenitor o tutor, y únicamente un adulto puede comprar un Paquete.</p>');

t('t-4',['4. Planuri, prețuri și conținut','4. Plans, prices and content','4. Planes, precios y contenido'],
'<p>Aplicația are o versiune gratuită și patru oferte plătite, fiecare cu plată unică, nu abonament:</p><ul><li><b>Versiune gratuită:</b> calculul numerelor de bază, găsirea tiparelor și cursul de 7 zile, analiza încrucișată, profilul salvat pe dispozitiv, glosarul;</li><li><b>Numerologie Deep:</b> {{p_num}};</li><li><b>NLP Deep:</b> {{p_nlp}};</li><li><b>Profil încrucișat Pro:</b> {{p_cross}};</li><li><b>Toate cele trei pachete (bundle):</b> {{p_bundle}}.</li></ul><p>Conținutul fiecărui plan este cel descris în secțiunile „Pachete” și „Începe aici” ale Aplicației la data cumpărării. Prețul final, inclusiv impozitele indirecte aplicabile (IGIC sau TVA, după caz), este cel afișat în pagina de plată înainte să confirmi comanda.</p>',
'<p>The App has a free version and four paid offers, each a one-off payment, not a subscription:</p><ul><li><b>Free version:</b> the basic numbers calculation, the pattern finder and the 7-day course, the cross analysis, the profile saved on your device, the glossary;</li><li><b>Numerology Deep:</b> {{p_num}};</li><li><b>NLP Deep:</b> {{p_nlp}};</li><li><b>Cross Profile Pro:</b> {{p_cross}};</li><li><b>All three packages (bundle):</b> {{p_bundle}}.</li></ul><p>The content of each plan is the one described in the "Packages" and "Start here" sections of the App on the date of purchase. The final price, including the applicable indirect taxes (IGIC or VAT, as the case may be), is the one shown on the payment page before you confirm the order.</p>',
'<p>La Aplicación tiene una versión gratuita y cuatro ofertas de pago, cada una con pago único, no suscripción:</p><ul><li><b>Versión gratuita:</b> el cálculo de los números básicos, el buscador de patrones y el curso de 7 días, el análisis cruzado, el perfil guardado en el dispositivo, el glosario;</li><li><b>Numerología Deep:</b> {{p_num}};</li><li><b>PNL Deep:</b> {{p_nlp}};</li><li><b>Perfil cruzado Pro:</b> {{p_cross}};</li><li><b>Los tres paquetes (bundle):</b> {{p_bundle}}.</li></ul><p>El contenido de cada plan es el descrito en las secciones "Paquetes" y "Empieza aquí" de la Aplicación en la fecha de la compra. El precio final, incluidos los impuestos indirectos aplicables (IGIC o IVA, según corresponda), es el que se muestra en la página de pago antes de confirmar el pedido.</p>');

t('t-5',['5. Plata, livrarea și activarea','5. Payment, delivery and activation','5. Pago, entrega y activación'],
'<p>Plata se face pe pagina unui procesator de plăți extern (de exemplu Stripe). Vânzătorul nu vede și nu păstrează datele cardului tău.</p><p>Pachetul se livrează în format digital: primești un fișier cu extensia .sfpack și un cod de activare personal, prin e-mail sau pe pagina de confirmare a plății. Pachetul se activează în Aplicație, la secțiunea „Pachete”, prin alegerea fișierului și introducerea codului.</p><p>Pachetul activat rămâne disponibil în browserul în care l-ai activat, cât timp nu ștergi datele site-ului. Păstrează fișierul și codul: dacă schimbi dispozitivul sau ștergi datele, le poți folosi din nou pentru reactivare, fără cost.</p>',
'<p>Payment is made on the page of an external payment processor (for example Stripe). The Seller does not see or keep your card details.</p><p>The Package is delivered in digital form: you receive a file with the .sfpack extension and a personal activation code, by e-mail or on the payment confirmation page. The Package is activated in the App, in the "Packages" section, by choosing the file and entering the code.</p><p>The activated Package stays available in the browser where you activated it, as long as you do not clear the site data. Keep the file and the code: if you change device or clear the data, you can use them again to reactivate, at no cost.</p>',
'<p>El pago se realiza en la página de un procesador de pagos externo (por ejemplo Stripe). El Vendedor no ve ni conserva los datos de tu tarjeta.</p><p>El Paquete se entrega en formato digital: recibes un archivo con extensión .sfpack y un código de activación personal, por correo o en la página de confirmación del pago. El Paquete se activa en la Aplicación, en la sección "Paquetes", eligiendo el archivo e introduciendo el código.</p><p>El Paquete activado permanece disponible en el navegador donde lo activaste, mientras no borres los datos del sitio. Guarda el archivo y el código: si cambias de dispositivo o borras los datos, puedes usarlos de nuevo para reactivarlo, sin coste.</p>');

t('t-6',['6. Licența de utilizare','6. Licence to use','6. Licencia de uso'],
'<p>La cumpărarea unui Pachet primești o licență personală, neexclusivă și netransferabilă de a-l folosi pentru uz propriu.</p><p>Nu ai voie să copiezi, să redistribui, să revinzi, să publici sau să partajezi fișierele de Pachet, codurile de activare ori conținutul lor, și nu ai voie să eludezi mecanismele de acces.</p><p>Pachetul „Profil încrucișat Pro” îți permite, în plus, să pregătești rapoarte pentru proprii tăi clienți, ca instrument de lucru. Nu poți însă să le transmiți fișierul de Pachet sau codul de activare. Ca profesionist, răspunzi singur pentru informarea clienților, pentru consimțământul lor și pentru afirmațiile pe care le faci.</p>',
'<p>When you buy a Package you receive a personal, non-exclusive and non-transferable licence to use it for your own use.</p><p>You may not copy, redistribute, resell, publish or share the Package files, the activation codes or their content, and you may not circumvent the access mechanisms.</p><p>The "Cross Profile Pro" Package also allows you to prepare reports for your own clients as a work tool. You may not, however, pass the Package file or the activation code on to them. As a professional, you alone are responsible for informing your clients, for their consent and for the statements you make.</p>',
'<p>Al comprar un Paquete recibes una licencia personal, no exclusiva e intransferible para usarlo para uso propio.</p><p>No puedes copiar, redistribuir, revender, publicar ni compartir los archivos del Paquete, los códigos de activación ni su contenido, y no puedes eludir los mecanismos de acceso.</p><p>El Paquete "Perfil cruzado Pro" te permite además preparar informes para tus propios clientes como herramienta de trabajo. No puedes, sin embargo, transmitirles el archivo del Paquete ni el código de activación. Como profesional, eres el único responsable de informar a tus clientes, de su consentimiento y de las afirmaciones que hagas.</p>');

t('t-7',['7. Dreptul de retragere','7. Right of withdrawal','7. Derecho de desistimiento'],
'<p>Dacă ești consumator în Uniunea Europeană, ai, de regulă, dreptul de a te retrage dintr-un contract încheiat la distanță în termen de 14 zile, fără a da explicații.</p><p>Pentru conținutul digital livrat pe un suport nematerial, acest drept se pierde atunci când execuția a început cu acordul tău prealabil expres și cu recunoașterea faptului că, în acest caz, pierzi dreptul de retragere (art. 16 lit. (m) din Directiva 2011/83/UE; în Spania, art. 103 lit. m) din Real Decreto Legislativo 1/2007).</p><p>Prin bifarea căsuței corespunzătoare la cumpărare sau la activare, ceri în mod expres livrarea imediată a Pachetului și confirmi că înțelegi că, odată ce accesul a început, nu te mai poți retrage. Dacă nu ești de acord, livrarea se amână până la expirarea celor 14 zile, iar în acest interval poți renunța la comandă.</p>',
'<p>If you are a consumer in the European Union, you generally have the right to withdraw from a distance contract within 14 days without giving any reason.</p><p>For digital content supplied on a non-tangible medium, this right is lost when performance has begun with your prior express consent and with your acknowledgement that, in that case, you lose the right of withdrawal (Article 16(m) of Directive 2011/83/EU; in Spain, Article 103(m) of Real Decreto Legislativo 1/2007).</p><p>By ticking the corresponding box at purchase or activation, you expressly request immediate delivery of the Package and confirm that you understand that, once access has begun, you can no longer withdraw. If you do not agree, delivery is postponed until the 14 days have expired, and during that period you may cancel the order.</p>',
'<p>Si eres consumidor en la Unión Europea, tienes, por regla general, derecho a desistir de un contrato celebrado a distancia en el plazo de 14 días, sin necesidad de justificación.</p><p>En el caso del contenido digital suministrado en un soporte no material, este derecho se pierde cuando la ejecución ha comenzado con tu consentimiento previo y expreso y con el reconocimiento de que, en ese caso, pierdes el derecho de desistimiento (artículo 16, letra m), de la Directiva 2011/83/UE; en España, artículo 103, letra m), del Real Decreto Legislativo 1/2007).</p><p>Al marcar la casilla correspondiente en la compra o en la activación, solicitas expresamente la entrega inmediata del Paquete y confirmas que entiendes que, una vez iniciado el acceso, ya no puedes desistir. Si no estás de acuerdo, la entrega se aplaza hasta que expiren los 14 días y, durante ese periodo, puedes cancelar el pedido.</p>');

t('t-8',['8. Conformitatea și remedii','8. Conformity and remedies','8. Conformidad y remedios'],
'<p>Dacă un Pachet nu poate fi activat sau nu corespunde descrierii din motive imputabile Vânzătorului, scrie-ne la {{mail}}. Vom remedia problema (fișier corectat sau cod nou) într-un termen rezonabil. Dacă remedierea nu este posibilă într-un termen rezonabil, vom rambursa prețul plătit, potrivit legislației aplicabile privind conformitatea conținutului digital (Directiva (UE) 2019/770).</p><p>Drepturile tale legale de consumator rămân neafectate de acești Termeni.</p>',
'<p>If a Package cannot be activated or does not match its description for reasons attributable to the Seller, write to us at {{mail}}. We will fix the problem (a corrected file or a new code) within a reasonable time. If a fix is not possible within a reasonable time, we will refund the price paid, in accordance with the applicable law on the conformity of digital content (Directive (EU) 2019/770).</p><p>Your statutory consumer rights are not affected by these Terms.</p>',
'<p>Si un Paquete no puede activarse o no se corresponde con su descripción por causas imputables al Vendedor, escríbenos a {{mail}}. Corregiremos el problema (un archivo corregido o un código nuevo) en un plazo razonable. Si la corrección no es posible en un plazo razonable, reembolsaremos el precio pagado, conforme a la legislación aplicable sobre conformidad de los contenidos digitales (Directiva (UE) 2019/770).</p><p>Tus derechos legales como consumidor no se ven afectados por estos Términos.</p>');

t('t-9',['9. Folosirea corectă','9. Proper use','9. Uso correcto'],
'<p>Te obligi să folosești Aplicația conform legii și acestor Termeni. Nu o folosi pentru a induce în eroare, pentru a face afirmații medicale sau terapeutice despre alte persoane ori pentru a prezenta rezultatele ca diagnostice sau garanții.</p><p>Dacă folosești Aplicația cu alte persoane (de exemplu cu clienți), informează-le clar că este un instrument de reflecție, nu un act medical sau psihologic, și obține-le consimțământul înainte de a le introduce datele.</p>',
'<p>You agree to use the App in accordance with the law and these Terms. Do not use it to mislead, to make medical or therapeutic claims about other people, or to present the results as diagnoses or guarantees.</p><p>If you use the App with other people (for example with clients), tell them clearly that it is a reflection tool, not a medical or psychological act, and obtain their consent before entering their data.</p>',
'<p>Te comprometes a usar la Aplicación conforme a la ley y a estos Términos. No la uses para inducir a error, para hacer afirmaciones médicas o terapéuticas sobre otras personas ni para presentar los resultados como diagnósticos o garantías.</p><p>Si usas la Aplicación con otras personas (por ejemplo, con clientes), infórmales claramente de que es una herramienta de reflexión y no un acto médico ni psicológico, y obtén su consentimiento antes de introducir sus datos.</p>');

t('t-10',['10. Protecția datelor personale','10. Personal data protection','10. Protección de datos personales'],
'<p><b>Operator.</b> Operatorul datelor este Vânzătorul, identificat la secțiunea 1, contact {{mail}}.</p><p><b>Date care rămân pe dispozitivul tău.</b> Numele, data nașterii, textele, check-in-urile, jurnalul și progresul din programe se salvează doar în browserul tău (stocare locală). Nu le primim și nu le prelucrăm. Le poți exporta, le poți șterge din Aplicație („Despre” și „Contul meu”) sau ștergând datele site-ului din browser.</p><p><b>Adresa de e-mail.</b> O prelucrăm doar dacă o introduci și bifezi consimțământul. Scopul este trimiterea profilului sau a materialelor cerute și, numai dacă bifezi separat această opțiune, comunicări comerciale despre produse similare. Temeiul este consimțământul tău (art. 6 alin. (1) lit. (a) din Regulamentul (UE) 2016/679, „RGPD”). Se transmit doar: e-mailul, limba, versiunea Termenilor, data consimțământului și pachetele active. Data nașterii și textele tale nu se transmit niciodată. Îți poți retrage consimțământul oricând, scriindu-ne la {{mail}}; retragerea nu afectează legalitatea prelucrării de până atunci.</p><p><b>Plata.</b> Datele de plată sunt prelucrate de procesatorul de plăți, ca operator propriu. Noi primim confirmarea plății și datele necesare facturării, pe care le păstrăm pe perioadele impuse de legislația fiscală și contabilă.</p><p><b>Destinatari.</b> Furnizori de servicii (găzduire, e-mail, plăți) care acționează conform instrucțiunilor noastre sau ca operatori proprii. Dacă un furnizor se află în afara Spațiului Economic European, transferul se face cu garanții adecvate. Nu luăm decizii automate cu efecte juridice asupra ta.</p><p><b>Drepturile tale.</b> Ai dreptul de acces, rectificare, ștergere, restricționare, portabilitate și opoziție. Le poți exercita scriindu-ne la {{mail}}. Ai dreptul să depui o plângere la autoritatea de supraveghere: Agencia Española de Protección de Datos (www.aepd.es) sau autoritatea din țara ta.</p><p><b>Date tehnice.</b> Dacă folosești Aplicația online, furnizorul de găzduire poate prelucra în jurnalele sale date tehnice (de exemplu adresa IP).</p><p><b>Cookie-uri.</b> Aplicația nu folosește cookie-uri de urmărire sau de publicitate. Folosește doar stocarea locală a browserului, strict pentru funcționare: limba, tema, pachetele, profilul salvat și evoluția.</p>',
'<p><b>Controller.</b> The data controller is the Seller, identified in section 1, contact {{mail}}.</p><p><b>Data that stays on your device.</b> Your name, birth date, texts, check-ins, journal and progress in the programs are saved only in your browser (local storage). We do not receive or process them. You can export them, delete them in the App ("About" and "My profile"), or clear the site data in your browser.</p><p><b>E-mail address.</b> We process it only if you enter it and tick the consent. The purpose is to send the profile or the materials you ask for and, only if you tick that option separately, commercial communications about similar products. The legal basis is your consent (Article 6(1)(a) of Regulation (EU) 2016/679, "GDPR"). Only the following is transmitted: the e-mail, the language, the Terms version, the consent date and the active packages. Your birth date and your texts are never transmitted. You can withdraw your consent at any time by writing to {{mail}}; withdrawal does not affect the lawfulness of processing before it.</p><p><b>Payment.</b> Payment data is processed by the payment processor as its own controller. We receive the payment confirmation and the data needed for invoicing, which we keep for the periods required by tax and accounting law.</p><p><b>Recipients.</b> Service providers (hosting, e-mail, payments) acting on our instructions or as their own controllers. If a provider is outside the European Economic Area, the transfer is made with adequate safeguards. We take no automated decisions with legal effects on you.</p><p><b>Your rights.</b> You have the right of access, rectification, erasure, restriction, portability and objection. You can exercise them by writing to {{mail}}. You have the right to lodge a complaint with the supervisory authority: the Agencia Española de Protección de Datos (www.aepd.es) or the authority in your country.</p><p><b>Technical data.</b> If you use the App online, the hosting provider may process technical data (for example the IP address) in its logs.</p><p><b>Cookies.</b> The App does not use tracking or advertising cookies. It uses only the browser\'s local storage, strictly for operation: language, theme, packages, the saved profile and evolution.</p>',
'<p><b>Responsable.</b> El responsable del tratamiento es el Vendedor, identificado en la sección 1, contacto {{mail}}.</p><p><b>Datos que permanecen en tu dispositivo.</b> Tu nombre, fecha de nacimiento, textos, check-ins, diario y progreso en los programas se guardan solo en tu navegador (almacenamiento local). No los recibimos ni los tratamos. Puedes exportarlos, borrarlos en la Aplicación ("Acerca de" y "Mi perfil") o borrando los datos del sitio en tu navegador.</p><p><b>Dirección de correo.</b> La tratamos solo si la introduces y marcas el consentimiento. La finalidad es enviarte el perfil o los materiales que solicites y, únicamente si marcas esa opción por separado, comunicaciones comerciales sobre productos similares. La base jurídica es tu consentimiento (artículo 6.1.a) del Reglamento (UE) 2016/679, "RGPD"). Solo se transmite: el correo, el idioma, la versión de los Términos, la fecha del consentimiento y los paquetes activos. Tu fecha de nacimiento y tus textos nunca se transmiten. Puedes retirar tu consentimiento en cualquier momento escribiéndonos a {{mail}}; la retirada no afecta a la licitud del tratamiento anterior.</p><p><b>Pago.</b> Los datos de pago los trata el procesador de pagos como responsable propio. Nosotros recibimos la confirmación del pago y los datos necesarios para la facturación, que conservamos durante los plazos exigidos por la normativa fiscal y contable.</p><p><b>Destinatarios.</b> Proveedores de servicios (alojamiento, correo, pagos) que actúan según nuestras instrucciones o como responsables propios. Si un proveedor se encuentra fuera del Espacio Económico Europeo, la transferencia se realiza con garantías adecuadas. No adoptamos decisiones automatizadas con efectos jurídicos sobre ti.</p><p><b>Tus derechos.</b> Tienes derecho de acceso, rectificación, supresión, limitación, portabilidad y oposición. Puedes ejercerlos escribiéndonos a {{mail}}. Tienes derecho a presentar una reclamación ante la autoridad de control: la Agencia Española de Protección de Datos (www.aepd.es) o la autoridad de tu país.</p><p><b>Datos técnicos.</b> Si usas la Aplicación en línea, el proveedor de alojamiento puede tratar datos técnicos (por ejemplo, la dirección IP) en sus registros.</p><p><b>Cookies.</b> La Aplicación no usa cookies de seguimiento ni de publicidad. Usa únicamente el almacenamiento local del navegador, estrictamente para su funcionamiento: idioma, tema, paquetes, perfil guardado y evolución.</p>');

'<p>To the extent permitted by law, the Seller does not guarantee any particular personal, professional or financial result and is not liable for decisions taken solely on the basis of the App. The free version is provided "as is".</p><p>Nothing in these Terms excludes or limits liability that cannot be excluded or limited by law, in particular liability for wilful misconduct or gross negligence, for injury to life or bodily integrity, or the mandatory rights of consumers.</p>',

'<p>Acești Termeni sunt guvernați de legea spaniolă. Dacă ești consumator, rămâi protejat de dispozițiile imperative ale legii țării tale de reședință, iar litigiile pot fi aduse în fața instanțelor competente potrivit legii aplicabile.</p><p>Înainte de orice demers, te invităm să ne scrii la {{mail}}: încercăm să rezolvăm amiabil orice nemulțumire.</p>',

/* Strategic Flow pack crypto (shared by the app and Pack Studio). PBKDF2-SHA256 + AES-GCM, Web Crypto only. */
var SFCrypto=(function(){
 var enc=new TextEncoder(),dec=new TextDecoder();
 function b64e(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
 function b64d(s){var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
 function normCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
 function ok(){return !!(window.crypto&&crypto.subtle);}
 function key(code,salt,it){return crypto.subtle.importKey('raw',enc.encode(normCode(code)),'PBKDF2',false,['deriveKey']).then(function(base){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
 function encrypt(obj,code){var it=150000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return key(code,salt,it).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc.encode(JSON.stringify(obj)));}).then(function(ct){
   return {sfpack:1,enc:1,id:obj.id,name:obj.name,it:it,salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};});}

/* ===== packages: install, unlock, sanitize ===== */
function has(f){return Object.keys(S.packs).some(function(id){var p=S.packs[id];return p&&(p.unlocks||[]).indexOf(f)>=0;});}
function pdata(f){var out={};Object.keys(S.packs).forEach(function(id){var p=S.packs[id];if(p&&(p.unlocks||[]).indexOf(f)>=0&&p.data&&p.data[f]){var d=p.data[f];Object.keys(d).forEach(function(k){out[k]=d[k];});}});return out;}
function cleanHTML(html){
 var doc=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');var root=doc.body.firstChild;
 ['script','iframe','object','embed','link','meta','base','form','style','svg','math','template'].forEach(function(t){Array.prototype.slice.call(root.querySelectorAll(t)).forEach(function(n){n.parentNode.removeChild(n);});});
 Array.prototype.slice.call(root.querySelectorAll('*')).forEach(function(n){
  Array.prototype.slice.call(n.attributes).forEach(function(a){var nm=a.name.toLowerCase(),v=String(a.value).trim().toLowerCase();
   if(nm.indexOf('on')===0||nm==='style'||nm==='srcdoc'){n.removeAttribute(a.name);return;}
   if((nm==='href'||nm==='src'||nm==='xlink:href')&&!(/^(https?:|mailto:|#|\/|data:image\/(png|jpeg|webp|gif);)/.test(v)))n.removeAttribute(a.name);
   if(nm==='data-tool'&&!TOOLS[a.value])n.removeAttribute(a.name);});
  if(n.tagName==='A'&&n.getAttribute('href')&&/^https?:/i.test(n.getAttribute('href'))){n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer');}});
 return root.innerHTML;
}
function validPack(p){return p&&p.sfpack===1&&typeof p.id==='string'&&/^[a-z0-9-]{2,40}$/.test(p.id)&&p.name&&typeof p.name==='object'&&Array.isArray(p.unlocks||[]);}
function installPack(p){
 if(!validPack(p))throw new Error('invalid');
 if(p.chapters)p.chapters.forEach(function(c){if(c.html){Object.keys(c.html).forEach(function(l){c.html[l]=cleanHTML(c.html[l]);});}});
 S.packs[p.id]=p;sset('packs',S.packs);
}
function installAny(obj,done){if(obj&&Array.isArray(obj.packs)){obj.packs.forEach(function(p){installPack(p);done.push(tr(p.name));});}else{installPack(obj);done.push(tr(obj.name));}}
function packChapters(area){
 var out=[];Object.keys(S.packs).forEach(function(id){var p=S.packs[id];(p.chapters||[]).forEach(function(c){if(c.area===area)out.push({id:'x-'+p.id+'-'+c.id,area:area,title:c.title,html:c.html,pro:true,pack:p.id});});});return out;
}

function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function evoMetrics(h){
 var n=h.length,m={n:n};if(!n)return m;
 var f=h[0],l=h[n-1];m.days=Math.floor((l.t-f.t)/864e5);m.since=Math.floor((Date.now()-l.t)/864e5);
 var mo=h.map(function(x){return x.mood;});
 m.early=avg(mo.slice(0,Math.min(3,n)));m.recent=avg(mo.slice(-Math.min(3,n)));m.trend=n>=3?m.recent-m.early:0;
 m.adh=avg(h.slice(-5).map(function(x){return x.step===2?1:(x.step===1?0.5:0);}));
 m.low=n>=2&&h[n-1].mood<=3&&h[n-2].mood<=3;
 m.top=null;for(var i=n-1;i>=0&&!m.top;i--){if(h[i].top)m.top=h[i].top;}
 m.first=null;for(var j=0;j<n&&!m.first;j++){if(h[j].top)m.first=h[j].top;}
 m.shift=n>=3&&!!h[n-1].top&&h[n-1].top===h[n-2].top&&!!m.first&&h[n-1].top!==m.first;
 return m;
}
function evoStage(m){
 if(!m.n)return 'start';
 if(m.since>=7)return 'return';
 if(m.low||(m.n>=3&&m.trend<=-1.5))return 'dip';
 if(m.shift)return 'shift';
 if(m.n<3||m.days<6)return 'observe';
 if(m.days<14)return 'frame';
 if(m.days<21)return 'experiment';
 return m.trend>=1?'consolidate':'plateau';
}
var STAGE_TRACK=['observe','frame','experiment','consolidate'];

 var dots=h.map(function(x,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.mood).toFixed(1)+'" r="3.2" class="ev-dm"/>';}).join('');
 return '<figure class="evo-fig"><svg viewBox="0 0 '+W+' '+H+'" class="evo-svg" role="img" aria-label="'+esc(ui('evo_chart_label'))+'">'+g+'<path d="'+path('int')+'" class="ev-i"/><path d="'+path('mood')+'" class="ev-m"/>'+dots+'<text x="'+pl+'" y="'+(H-6)+'" class="ev-t">'+esc(shortDate(h[0].t))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" class="ev-t">'+esc(shortDate(h[n-1].t))+'</text></svg><figcaption class="small"><span class="lg lg-m"></span> '+ui('evo_leg_mood')+' &nbsp; <span class="lg lg-i"></span> '+ui('evo_leg_int')+'</figcaption></figure>';

var GLP=null;
function glPatterns(){
 if(GLP&&GLP.lang===lang)return GLP.list;
 var list=[];GLOSS.forEach(function(g){listOf(g.m).forEach(function(p){var f=flat(p).replace(/\s+/g,' ').trim();if(f.length>=3)list.push({id:g.id,f:f});});});
 list.sort(function(a,b){return b.f.length-a.f.length;});
 list.forEach(function(p){p.re=new RegExp('(?<![a-z0-9])'+escRe(p.f).replace(/ /g,'[^a-z0-9]+')+'(?![a-z0-9])','g');});
 GLP={lang:lang,list:list};return list;
}
function linkGlossary(root){
 var pats=glPatterns();
 $$('.cbody',root).forEach(function(cb){
  var seen={},nodes=[],w=document.createTreeWalker(cb,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode;if(!p||(p.closest&&p.closest('a,button,input,textarea,select,h1,h2,h3,h4,h5,h6,[data-tool],mark,.locked,.gl,.out,summary')))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim().length>2?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(node){
   while(node){
    var fl=flat(node.nodeValue),best=null;
    pats.forEach(function(p){if(seen[p.id])return;p.re.lastIndex=0;var m=p.re.exec(fl);if(m&&(!best||m.index<best.i||(m.index===best.i&&m[0].length>best.l)))best={i:m.index,l:m[0].length,id:p.id};});
    if(!best)break;
    seen[best.id]=1;var mid=node.splitText(best.i),after=mid.splitText(best.l);
    var a=document.createElement('a');a.className='gl';a.href='#/gloss/'+best.id;a.setAttribute('data-gl',best.id);a.textContent=mid.nodeValue;mid.parentNode.replaceChild(a,mid);node=after;
   }
  });
 });
}
