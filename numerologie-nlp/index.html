:root{color-scheme:light;--bg:#FBFDFD;--fg:#0F2530;--muted:#3D5A66;--line:#CBD9DC;--accent:#0C8A86;--accent-ink:#066562;--tint:#E4F4F3;--surface:#FFFFFF;
--num:#8A5A0B;--num-tint:#FFF3DC;--cross:#5B3FA8;--cross-tint:#EFEAFB;--warn:#8A4B00;--warn-bg:#FFF4E0;--warn-line:#E9C58A;--bad:#9B1C1C;--bad-bg:#FDECEC;--bad-line:#E8A9A9;--mark:#FFE9A8;
--f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0B1A20;--fg:#E7F1F3;--muted:#A9C0C7;--line:#27424B;--accent:#3CC6BE;--accent-ink:#5FD8D0;--tint:#12343A;--surface:#112830;--num:#E8B25A;--num-tint:#2C2312;--cross:#B7A2F5;--cross-tint:#241D3D;--warn:#F0C06A;--warn-bg:#2C2312;--warn-line:#6B5424;--bad:#FFB4B4;--bad-bg:#3A1717;--bad-line:#7A3333;--mark:#5A4A12}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B1A20;--fg:#E7F1F3;--muted:#A9C0C7;--line:#27424B;--accent:#3CC6BE;--accent-ink:#5FD8D0;--tint:#12343A;--surface:#112830;--num:#E8B25A;--num-tint:#2C2312;--cross:#B7A2F5;--cross-tint:#241D3D;--warn:#F0C06A;--warn-bg:#2C2312;--warn-line:#6B5424;--bad:#FFB4B4;--bad-bg:#3A1717;--bad-line:#7A3333;--mark:#5A4A12}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.62;overflow-wrap:anywhere}
h1,h2,h3,h4,h5{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:8px;top:-60px;background:var(--fg);color:var(--bg);padding:10px 14px;z-index:100}
.skip:focus{top:8px}
.muted{color:var(--muted)}.small{font-size:.9rem}
#app{min-height:100vh}
/* header */
.hd{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:8px clamp(14px,4vw,32px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);flex:none}
.brand .bt{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.logo.sm{width:40px;height:40px}
.tabs{display:flex;gap:2px;margin-inline:auto}
.tabs a{display:flex;align-items:center;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;min-height:44px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.langs{display:flex}
.langs button,.thbtn{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:12px}
.langs button+button{border-left:0}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.thbtn{font-size:18px}
@media (max-width:820px){
 .hd{gap:8px}
 .brand .bt small{display:none}
 .ctl{margin-left:auto}
 .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
 .tabs a{flex:1;justify-content:center;padding:6px 2px;font-size:.78rem;min-height:56px;text-align:center;border-bottom:0;border-top:3px solid transparent;line-height:1.15}
 .tabs a[aria-current]{border-top-color:var(--accent)}
 main{padding-bottom:84px}
}
main{padding:0 clamp(16px,5vw,48px) 40px;max-width:1200px;margin-inline:auto;outline:0}
/* hero */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:10px}
.hero{padding-block:clamp(32px,7vw,72px) 12px}
.hero h1{font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--accent-ink)}
.lead{margin-top:18px;font-size:1.15rem;color:var(--muted);max-width:60ch}
.hero-cta,.lk-actions,.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.row{margin-top:14px}

--gold:#8A6612;--goldf:#E6CB8E;--ice:#0A6786;--icef:#A6DDF3;--ame:#4A3DCB;--amef:#B7ABFF;--ink:#14110A;
--accent:#4A3DCB;--accent-ink:#3A2EB8;--tint:rgba(74,61,203,.07);--num:#7C5A0A;--num-tint:rgba(230,203,142,.28);--cross:#4A3DCB;--cross-tint:rgba(74,61,203,.08);--mark:rgba(10,103,134,.14);
--warn:#7A4B00;--warn-bg:#FFF4E0;--warn-line:#E9C58A;--bad:#9B1C1C;--bad-bg:#FDECEC;--bad-line:#E8A9A9;--glow:0 14px 44px rgba(20,25,70,.12)}
html{background:var(--bg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.62;background:transparent;color:var(--fg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1.2px 1.2px at 34% 62%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 88% 58%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1px 1px at 56% 86%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1px 1px at 6% 78%,rgba(255,255,255,.35),transparent 60%),
 radial-gradient(60% 50% at 80% -5%,rgba(118,96,255,.16),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(70,190,230,.07),transparent 70%),var(--bg)}
:root[data-theme="light"] body::before{background:radial-gradient(60% 50% at 80% -5%,rgba(118,96,255,.10),transparent 70%),var(--bg)}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;line-height:1.08}
h3,h4,h5{font-family:var(--f-body);font-weight:650;letter-spacing:-.01em}
.eyebrow,.tl-role,.lab,.ac-k,.facets dt,thead th,.toc summary,.badge,.badge-pro,.stage .lab{font-family:var(--f-mono);text-transform:none;letter-spacing:.01em;font-weight:500;font-size:12px}
.muted{color:var(--muted)}
a{color:var(--accent-ink)}
.badge-pro,.badge{border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:0 8px;background:transparent;font-size:11px}
.badge.ok{background:var(--gold);color:var(--ink)}
/* header */
.hd{background:var(--bg);border-bottom:1px solid var(--line)}
.brand .bt b{font-family:var(--f-display);font-size:1.25rem;font-weight:400;letter-spacing:0}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.mark{width:40px;height:40px;flex:none;overflow:visible}.mark .mk-n{fill:rgba(230,203,142,.16)}.mark .mk-p{fill:rgba(166,221,243,.14)}.mark .mk-x{fill:rgba(183,171,255,.55)}.mark .mk-o1{fill:none;stroke:var(--gold);stroke-width:1.6}.mark .mk-o2{fill:none;stroke:var(--ice);stroke-width:1.6}
.tabs a{border:0;border-bottom:1px solid transparent;border-radius:0;min-height:44px;padding:8px 14px;font-weight:500;font-size:.95rem;color:var(--muted);white-space:nowrap;overflow-wrap:normal}
.tabs a:hover{color:var(--fg);background:transparent}
.tabs a[aria-current]{color:var(--gold);border-bottom:1px solid var(--gold);background:transparent;box-shadow:none}
.langs button,.thbtn{border:1px solid var(--edge);background:transparent;color:var(--fg);border-radius:8px;font-family:var(--f-mono);font-weight:500;min-width:38px;min-height:36px;font-size:12px}
.langs button+button{margin-left:-1px;border-left:1px solid var(--edge)}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
@media (min-width:821px) and (max-width:1180px){.tabs a{padding:8px 9px;font-size:.88rem}.brand .bt small{display:none}.hd{gap:10px}}
@media (max-width:820px){
 .tabs{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border:1px solid var(--edge);border-radius:16px;background:var(--surface);box-shadow:var(--glow);padding:4px;gap:0}
 .tabs a{border-radius:12px;min-height:46px;padding:4px 1px;font-size:.62rem;letter-spacing:-.01em;border:0;word-break:normal;hyphens:none;white-space:normal}
 .tabs a[aria-current]{background:rgba(230,203,142,.12);border:0;color:var(--gold)}
 main{padding-bottom:110px}.brand .bt small{display:none}
}
@media (max-width:480px){.hd{gap:6px;padding-inline:10px}.brand{gap:6px}.brand .bt b{font-size:1.05rem;white-space:nowrap}.mark{width:32px;height:32px}.langs button,.thbtn{min-width:33px;min-height:34px;font-size:11px}.ctl{gap:5px}}
/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border:1px solid var(--edge);border-radius:10px;background:transparent;color:var(--fg);font-weight:550;box-shadow:none;transition:border-color .18s,background .18s}
.btn:hover{background:var(--tint);border-color:var(--accent);transform:none}
.btn:active{transform:translateY(1px)}
.btn.primary,.btn.dark{background:var(--goldf);border-color:var(--goldf);color:var(--ink);font-weight:650}
.btn.primary:hover,.btn.dark:hover{background:#F2DBA4;border-color:#F2DBA4}
.btn.big{padding:16px 32px;font-size:1.05rem}
input[type=text],input[type=date],input[type=email],textarea,select,.gl-search input{border:1px solid var(--edge);border-radius:10px;background:var(--bg2);color:var(--fg);padding:11px 13px}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 65%,transparent)}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px rgba(230,203,142,.18)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
input[type=checkbox]{accent-color:var(--gold)}
.chip,.track li{border:1px solid var(--edge);border-radius:99px;background:transparent}
/* generic surfaces */
.tile,.ncard,.tcard,.pack-card,.stage,.readbox,.locked,.importbox,.jentry,.ling,.yours,.tbody.solo,.res,.risk,.warn,.warnbox,.empty,.pro-hint,.ntab,.radios,.bundle,.notes,.areacard{border:1px solid var(--edge);border-radius:var(--r);background:var(--surface)}
.warn,.warnbox{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.risk{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}.risk-care{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.res,.readbox,.stage,.c-focus,.c-avoid,.how{border-left-width:3px}
.res-hit{background:var(--cross-tint)}.res-sit{background:var(--num-tint)}.res-blind,.how,.c-focus,.stage,.readbox{background:var(--tint)}
.c-avoid{background:var(--warn-bg)}
.tile.now{border-color:var(--gold);background:var(--num-tint)}
.nb{background:transparent;color:var(--gold);border:1px solid var(--gold);font-family:var(--f-display);font-size:1.9rem;font-weight:400}
.nb.master{color:var(--ame);border-color:var(--ame);outline:1px solid var(--ame);outline-offset:3px;background:transparent}
.tl-n,.ntab b,.price{font-family:var(--f-display);font-weight:400;color:var(--gold)}
.tl-n.master{color:var(--ame)}
.price{font-size:1.9rem}
.ntab[aria-selected="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}.ntab[aria-selected="true"] b,.ntab[aria-selected="true"] span{color:var(--ink)}
.tcard summary{font-weight:600}.tcard summary::before{color:var(--gold)}
.tn{font-family:var(--f-body);font-weight:650}
.sig{height:6px;border:0;background:var(--line);border-radius:3px}.sig i{background:var(--gold)}
.cn{background:transparent;color:var(--gold);border:1px solid var(--gold);font-family:var(--f-mono);font-weight:500;font-size:.62em}
.area-nlp .cn{color:var(--ice);border-color:var(--ice)}.area-cross .cn{color:var(--ame);border-color:var(--ame)}
.ch h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.pbar{height:6px;border:0;border-radius:3px;background:var(--line)}.pbar i{background:var(--gold)}
th,td{border-bottom-color:var(--line)}
.toc{border-left:1px solid var(--edge)}
.toc a:hover,.toc a.on{color:var(--gold);font-weight:600}
.area-nlp .toc a.on,.area-nlp .toc a:hover{color:var(--ice)}.area-cross .toc a.on,.area-cross .toc a:hover{color:var(--ame)}
mark.mt{background:var(--mark);color:inherit;border-bottom:1px solid var(--ice);border-radius:2px}
mark.ml{border-bottom:1px dotted var(--ice);background:transparent}
mark.me{border-bottom:1px solid var(--ame);background:transparent}
a.gl{text-decoration-color:var(--gold)}
.backbar{background:var(--bg);border-bottom:1px solid var(--line)}
.ft{border-top:1px solid var(--line)}.ft .by{align-items:center}.ft .by .mark{width:32px;height:32px}.ft .by b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.plans th[scope=col]{font-family:var(--f-body)}
.steps li::before{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-mono);font-weight:500}
/* area banners */
.ah{position:relative;overflow:hidden;margin-top:clamp(18px,3vw,34px);padding:clamp(26px,5vw,52px);border:1px solid var(--edge);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,0) 55%),var(--surface);--mod:var(--muted)}
.ah::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--mod),transparent 70%)}
.ah h1{font-size:clamp(2rem,5vw,3.5rem);max-width:20ch;position:relative;z-index:1}
.ah .lead{color:var(--muted);position:relative;z-index:1;max-width:60ch}
.ah .eyebrow{color:var(--mod);position:relative;z-index:1;font-size:12px}
.ah::after{position:absolute;right:.04em;bottom:-.22em;font-family:var(--f-display);font-size:clamp(7rem,24vw,16rem);line-height:1;color:var(--mod);opacity:.09;pointer-events:none}
.area-num .ah{--mod:var(--gold)}.area-num .ah::after{content:"369"}
.area-nlp .ah{--mod:var(--ice)}.area-nlp .ah::after{content:"“ ”"}
.area-cross .ah{--mod:var(--ame)}.area-cross .ah::after{content:"×"}
.area-start .ah::after{content:"?"}.area-me .ah::after{content:"∞"}.area-terms .ah::after{content:"§"}
/* ===== HOME ===== */
.home{padding-top:clamp(20px,5vw,60px);position:relative}
.hero2{position:relative}
.rings{position:absolute;right:-8%;top:-12%;width:min(620px,70vw);aspect-ratio:1;opacity:.55;pointer-events:none;z-index:0}
.rings svg{width:100%;height:100%;overflow:visible}
.rings .r1{animation:spin 160s linear infinite;transform-origin:center}.rings .r2{animation:spin 110s linear infinite reverse;transform-origin:center}
.hero2 h1,.hero2 .lead2{position:relative;z-index:1}
.hero2 h1{font-size:clamp(2.7rem,7.2vw,6rem);line-height:1.0;letter-spacing:-.025em;max-width:14ch;font-weight:400}
.hero2 h1 span{display:block;animation:unveil 1.4s cubic-bezier(.2,.7,.2,1) both}
.hero2 .h-b{font-style:italic;color:var(--ice);animation-delay:.35s;margin-top:.12em}
@keyframes unveil{from{opacity:0;filter:blur(14px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
.lead2{margin-top:24px;font-size:1.15rem;color:var(--muted);max-width:52ch}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,28px);margin-top:clamp(34px,5vw,64px);align-items:stretch;position:relative;z-index:1}
.pane{position:relative;display:flex;flex-direction:column;gap:14px;padding:clamp(20px,3vw,32px);border:1px solid var(--edge);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--surface);box-shadow:var(--glow);min-width:0;--mod:var(--gold)}
.pane-p{--mod:var(--ice)}
.pane::before,.pane::after{content:"";position:absolute;width:16px;height:16px;border:1px solid var(--mod);opacity:.9}
.pane::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.pane::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.pane h2{font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.08;display:flex;flex-direction:column;gap:12px;align-items:flex-start;color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--mod);letter-spacing:.01em}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mod);box-shadow:0 0 10px var(--mod)}
.fld{font-weight:550;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.pane input,.pane textarea{background:var(--bg2);color:var(--fg);border:1px solid var(--edge);font-size:1.02rem}
.pane input:focus,.pane textarea:focus{border-color:var(--mod);box-shadow:0 0 0 3px color-mix(in srgb,var(--mod) 20%,transparent)}
.letters{display:flex;flex-wrap:wrap;gap:6px;min-height:62px;align-items:flex-end}
.letters.ghost{opacity:.45}
.lt{display:flex;flex-direction:column;align-items:center;width:36px;border:1px solid var(--edge);border-radius:8px;background:var(--bg2);padding:4px 0 3px;line-height:1}
.lt i{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.lt b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:var(--gold);margin-top:3px}
.lt.pop{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*50ms)}
.gap{width:12px}
@keyframes rise{from{transform:translateY(10px);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
.sumline{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-height:1.4em}.sumline b{color:var(--gold);font-weight:500}
.lp{display:flex;gap:18px;align-items:center;min-height:104px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg2)}
.lp .muted{font-size:.95rem}
.lpn{position:relative;flex:none;width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:3.1rem;color:var(--gold);border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 28px rgba(230,203,142,.18),inset 0 0 18px rgba(230,203,142,.08)}
.lpn::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(230,203,142,.5);animation:spin 40s linear infinite}
.lpt{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:.95rem;color:var(--muted)}.lpt>b{color:var(--fg);font-weight:600}.lpy{margin-top:6px;font-family:var(--f-mono);font-size:.8rem}.lpy b{color:var(--gold);font-weight:500}
.mirror{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.1rem;line-height:1.95;min-height:80px}
.mirror.ghost{opacity:.55}
.hint{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:34px}.lab2{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.tchip{border:1px solid var(--ice);color:var(--ice);border-radius:99px;padding:2px 13px;font-size:.88rem;font-weight:500;background:rgba(166,221,243,.07)}
.pane-go{margin-top:auto;padding-top:6px}
.free-note{margin-top:22px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:center}
.ribbon{margin:clamp(40px,6vw,76px) calc(50% - 50vw);width:100vw;overflow:hidden;border-block:1px solid var(--line);background:transparent}
.rtrack{display:flex;gap:30px;width:max-content;padding:13px 0;animation:marq 70s linear infinite;align-items:baseline;white-space:nowrap}
.rn{font-family:var(--f-mono);color:var(--gold);font-size:.95rem}.rw{font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:1.3rem}
@keyframes marq{to{transform:translateX(-50%)}}
.blk{margin-top:clamp(50px,8vw,110px);position:relative}
.blk-in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.blk-in.rev .demo{order:-1}
.blk h2{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.02;letter-spacing:-.02em}
.blk-txt p{margin-top:16px;max-width:46ch;font-size:1.06rem;color:var(--muted)}
.blk-n{--mod:var(--gold)}.blk-p{--mod:var(--ice)}.blk-x{--mod:var(--ame)}
.blk-txt h2::before{content:"";display:block;width:44px;height:1px;background:var(--mod);margin-bottom:22px}
.blk-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px!important}
.wheel-w{position:relative;width:100%;max-width:470px;aspect-ratio:1;margin-inline:auto}
.wheel{width:100%;height:100%;display:block;overflow:visible}
.w-ticks{fill:none;stroke:var(--gold);stroke-width:8;stroke-dasharray:1 8.35;opacity:.38}
.w-out{fill:none;stroke:var(--gold);stroke-width:1;opacity:.6}
.w-rot{transform-origin:200px 200px;animation:spin 90s linear infinite}
.w-dash{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:2 7;opacity:.5}
.w-poly{fill:none;stroke:var(--gold);stroke-width:1;stroke-linejoin:round;opacity:.28}
.w-node{cursor:pointer;outline:0}.w-c{fill:var(--bg);stroke:var(--gold);stroke-width:1.2;transition:fill .25s}
.w-t{font-family:"Geist Mono",monospace;font-weight:500;font-size:14px;fill:var(--gold);pointer-events:none}
.w-node:hover .w-c{fill:rgba(230,203,142,.16)}
.w-node.on .w-c{fill:var(--goldf);filter:drop-shadow(0 0 10px rgba(230,203,142,.7))}.w-node.on .w-t{fill:var(--ink)}
.w-node:focus-visible .w-c{stroke-width:3}
.w-you circle{stroke:var(--ame);stroke-width:1.2;stroke-dasharray:3 4;animation:spin 14s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel-c{position:absolute;inset:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;pointer-events:none}
.wheel-c b{font-family:var(--f-display);font-weight:400;font-size:clamp(3.6rem,11vw,5.6rem);line-height:.95;color:var(--gold);text-shadow:0 0 30px rgba(230,203,142,.3)}
.wk{font-family:var(--f-mono);font-size:.85rem;color:var(--fg)}.wt{font-size:.8rem;line-height:1.35;max-width:21ch;color:var(--muted)}
.wy{margin-top:4px;border:1px solid var(--ame);color:var(--ame);border-radius:99px;padding:0 11px;font-family:var(--f-mono);font-size:.72rem}
.demo{border:1px solid var(--edge);border-radius:16px;padding:clamp(20px,3vw,34px);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface);position:relative}
.demo::before{content:"";position:absolute;left:-1px;top:-1px;width:16px;height:16px;border:1px solid var(--ice);border-right:0;border-bottom:0;border-top-left-radius:16px}
.sentence{font-family:var(--f-display);font-size:clamp(1.6rem,3.3vw,2.4rem);line-height:1.35;letter-spacing:-.01em}
.pw{font:inherit;color:var(--ice);background:transparent;border:0;border-bottom:1px dashed var(--ice);border-radius:0;padding:0 1px;cursor:pointer;letter-spacing:inherit;font-style:italic;transition:background .2s}
.pw:hover,.pw.on{background:rgba(166,221,243,.14)}
.reveal{margin-top:22px;min-height:120px;border:1px solid var(--line);border-left:2px solid var(--ice);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:7px;justify-content:center;background:var(--bg2)}
.pt{align-self:flex-start;font-family:var(--f-mono);font-size:.78rem;color:var(--ice);border:1px solid var(--ice);border-radius:99px;padding:1px 11px}
.pq{font-size:1.12rem;line-height:1.4;animation:fadeup .4s both}.pq small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:.76rem;margin-bottom:3px}
@keyframes fadeup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.venn{max-width:480px;margin-inline:auto;width:100%}.venn svg{width:100%;height:auto;display:block;overflow:visible}
.v-a{fill:rgba(230,203,142,.07);stroke:var(--gold);stroke-width:1.2}.v-b{fill:rgba(166,221,243,.07);stroke:var(--ice);stroke-width:1.2}.v-x{fill:rgba(183,171,255,.34);stroke:var(--ame);stroke-width:1}
.v-t{font-family:"Instrument Serif",serif;font-size:24px;fill:var(--fg);text-anchor:middle}.v-xt{font-size:14px;font-family:"Geist Mono",monospace}
.v-a,.v-b{transition:transform .7s cubic-bezier(.2,.7,.2,1)}.venn:hover .v-a{transform:translateX(16px)}.venn:hover .v-b{transform:translateX(-16px)}
.doors,.plans-home,.steps3,.final{margin-top:clamp(56px,9vw,120px)}
.doors h2,.plans-home h2,.steps3 h2,.final h2{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.02;letter-spacing:-.02em;max-width:18ch}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.door{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px;border:1px solid var(--edge);border-radius:14px;text-decoration:none;color:var(--fg);background:var(--surface);transition:border-color .25s,background .25s,transform .25s;min-height:200px;--mod:var(--gold)}
.door:hover{border-color:var(--mod);background:color-mix(in srgb,var(--mod) 7%,var(--surface));transform:translateY(-3px)}
.door b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;letter-spacing:-.01em;margin-top:auto;line-height:1.05}.door>span:last-child{font-size:.95rem;color:var(--muted)}
.dico{width:44px;height:44px;display:block;color:var(--mod)}.dico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.dico .gx{fill:currentColor;stroke:none;font-family:"Geist Mono",monospace;font-weight:500;font-size:13px}
.d-start{--mod:var(--ice)}.d-me{--mod:var(--ame)}.d-num{--mod:var(--gold)}.d-nlp{--mod:var(--ice)}.d-cross{--mod:var(--ame)}.d-gloss{--mod:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;gap:8px;padding:26px 22px 22px;background:var(--surface);color:var(--fg);border:1px solid var(--edge);border-radius:16px}
.plan h3{font-size:1rem;line-height:1.3;min-height:2.6em;color:var(--muted);font-weight:550}
.pnum{display:flex;align-items:flex-start;gap:4px;font-family:var(--f-display);line-height:.9;margin-top:6px;color:var(--fg)}.pnum span{font-size:clamp(4rem,7vw,5.6rem);letter-spacing:-.03em}.pnum small{font-size:1.5rem;margin-top:.35em;color:var(--gold)}
.pdesc{font-size:.92rem;color:var(--muted);flex:1}.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pact .btn{padding:8px 16px;font-size:.92rem;min-height:40px}
.plan-b{border-color:var(--gold);background:linear-gradient(180deg,rgba(230,203,142,.12),rgba(230,203,142,.02)),var(--surface);box-shadow:0 0 0 1px rgba(230,203,142,.25),var(--glow)}
.plan-b .pnum span{color:var(--gold)}.plan-b h3{color:var(--gold)}
.ribn{position:absolute;top:-12px;left:20px;background:var(--bg);color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 12px;font-family:var(--f-mono);font-size:.74rem}
.steps3 ol{list-style:none;padding:0;margin:30px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.steps3 li{counter-increment:s;padding:22px 4px 0;border:0;border-top:1px solid var(--edge);display:flex;flex-direction:column;gap:8px;position:relative;background:transparent;border-radius:0}
.steps3 li::before{content:counter(s);font-family:var(--f-mono);font-size:.85rem;color:var(--gold);width:auto;height:auto;border:0;background:none;display:block}
.steps3 li::after{content:"";position:absolute;top:-1px;left:0;width:48px;height:1px;background:var(--gold)}
.steps3 li b{font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:1}.steps3 li span{color:var(--muted)}
.final{position:relative;text-align:center;padding:clamp(48px,8vw,100px) 18px;border:1px solid var(--edge);border-radius:22px;background:radial-gradient(60% 90% at 50% 0%,rgba(183,171,255,.16),transparent 70%),var(--surface);overflow:hidden;color:var(--fg)}
.final h2{margin-inline:auto;position:relative}.final p{margin-top:28px;position:relative}
.home .warn{margin-top:46px}

home_pk_p:L('Versiunea rapidă rămâne la îndemâna oricui. Pachetele adaugă analize mai profunde, programe de 21 de zile și rapoarte pentru consultații, chiar și offline.','The quick version stays available to anyone. Packages add deeper readings, 21-day programs and consultation reports, even offline.','La versión rápida sigue al alcance de todos. Los paquetes añaden lecturas más profundas, programas de 21 días e informes para consultas, incluso sin conexión.'),

warn_t:L('Important.','Important.','Importante.'),
warn_p:L('Instrument pentru reflecție și educație. Numerologia este o tradiție simbolică fără validare științifică, iar NLP are sprijin limitat în cercetare. Niciuna nu diagnostichează, nu prezice viitorul și nu înlocuiește un medic, un psiholog sau un psihoterapeut. Dacă te simți în pericol sau copleșit, vorbește cu un specialist sau cu o persoană de încredere.','A tool for reflection and education. Numerology is a symbolic tradition without scientific validation, and NLP has limited research support. Neither diagnoses, predicts the future or replaces a doctor, psychologist or therapist. If you feel unsafe or overwhelmed, talk to a professional or someone you trust.','Una herramienta para la reflexión y la educación. La numerología es una tradición simbólica sin validación científica y la PNL tiene un respaldo de investigación limitado. Ninguna diagnostica, predice el futuro ni sustituye a un médico, psicólogo o terapeuta. Si te sientes en peligro o desbordado, habla con un profesional o con alguien de confianza.'),

x_lp:L('Ziua {d}: {rd}. Luna {m}: {rm}. Anul {y}: {ry}. Suma: {sum} → {res}. Numerele maestre 11, 22 și 33 nu se reduc.','Day {d}: {rd}. Month {m}: {rm}. Year {y}: {ry}. Sum: {sum} → {res}. Master numbers 11, 22 and 33 are not reduced.','Día {d}: {rd}. Mes {m}: {rm}. Año {y}: {ry}. Suma: {sum} → {res}. Los números maestros 11, 22 y 33 no se reducen.'),

x_soul:L('Doar vocalele (A, E, I, O, U) însumează {vow} → {res}. Y se tratează ca consoană.','Vowels only (A, E, I, O, U) add up to {vow} → {res}. Y is treated as a consonant.','Solo las vocales (A, E, I, O, U) suman {vow} → {res}. La Y se trata como consonante.'),

f_try:L('Încearcă un exemplu:','Try an example:','Prueba un ejemplo:'),
f_ex1:L('Spun mereu da tuturor și apoi mă simt vinovat și epuizat. Nu pot spune nu, mi-e teamă că o să fie dezamăgiți de mine.','I always say yes to everyone and then feel guilty and exhausted. I can\'t say no, I\'m afraid they\'ll be disappointed in me.','Siempre digo que sí a todos y luego me siento culpable y agotado. No puedo decir que no, tengo miedo de decepcionarlos.'),
f_ex1_s:L('Nu pot spune nu','Can\'t say no','No sé decir que no'),
f_ex2:L('Nimic din ce fac nu e suficient de bun. Refac totul de trei ori și apoi amân să trimit pentru că aș putea greși.','Nothing I do is ever good enough. I redo everything three times, and then I put off sending it because I might make a mistake.','Nada de lo que hago es suficientemente bueno. Lo rehago todo tres veces y luego aplazo enviarlo porque podría cometer un error.'),
f_ex2_s:L('Niciodată suficient','Never good enough','Nunca es suficiente'),
f_ex3:L('Avem mereu aceeași ceartă. Nu mă ascultă și cred că mă vede ca pe o problemă. Mă enervează atât de tare.','We always have the same argument. He doesn\'t listen, and I think he sees me as a problem. It makes me so angry.','Siempre tenemos la misma discusión. No me escucha y creo que me ve como un problema. Me enfada muchísimo.'),

f_top_p:L('Semnalul arată cât de bine se potrivește tema cu textul tău, nu un diagnostic. Deschide fiecare temă pentru accent și cursul de 7 zile.','The signal shows how well the theme fits your text, not a diagnosis. Open each theme for the focus and the 7-day course.','La señal muestra cuánto encaja el tema con tu texto, no un diagnóstico. Abre cada tema para ver el énfasis y el curso de 7 días.'),

f_disc:L('Citirea combină cuvinte, ton și zone de viață; poate omite nuanțe sau interpreta greșit un cuvânt folosit în alt context. Tratează rezultatul ca pe o ipoteză de verificat, nu ca pe un diagnostic.','The reading combines words, tone and areas of life; it can miss nuance or misread a word used in another context. Treat the result as a hypothesis to check, not a diagnosis.','La lectura combina palabras, tono y áreas de la vida; puede omitir matices o malinterpretar una palabra usada en otro contexto. Trata el resultado como una hipótesis por comprobar, no como un diagnóstico.'),

risk_crisis_t:L('Contează mai mult decât orice instrument să fii în siguranță.','Your safety matters more than any tool.','Tu seguridad importa más que cualquier herramienta.'),
risk_crisis_p:L('Textul tău conține cuvinte legate de a-ți face rău sau de a nu mai vrea să trăiești. Nu îți dau un plan de exerciții pentru asta. Te rog să vorbești acum cu o persoană apropiată sau cu un specialist și să nu rămâi singur cu gândul.','Your text contains words about hurting yourself or not wanting to live. I will not give you an exercise plan for this. Please talk now to someone close to you or to a professional, and do not stay alone with the thought.','Tu texto contiene palabras sobre hacerte daño o no querer vivir. No te daré un plan de ejercicios para esto. Por favor, habla ahora con alguien cercano o con un profesional y no te quedes solo con ese pensamiento.'),
risk_lines:L('În Spania poți suna la 024, linia pentru persoane care se gândesc la suicid, gratuită și deschisă 24 de ore. Pentru urgențe oriunde în UE, sună la 112.','In Spain you can call 024, the line for people thinking about suicide, free and open 24 hours. For an emergency anywhere in the EU, call 112.','En España puedes llamar al 024, la línea de atención a la conducta suicida, gratuita y abierta las 24 horas. En una emergencia, en cualquier lugar de la UE, llama al 112.'),
risk_care_t:L('Aici merită sprijin profesional.','This deserves professional support.','Aquí conviene apoyo profesional.'),
risk_care_p:L('Textul tău atinge subiecte precum abuz, violență, traumă sau panică. Exercițiile de reformulare nu sunt potrivite pentru ele făcute singur. Un psiholog sau psihoterapeut cu experiență în traumă te poate însoți în siguranță.','Your text touches on abuse, violence, trauma or panic. Reframing exercises are not suited to these when done alone. A psychologist or therapist experienced in trauma can accompany you safely.','Tu texto toca temas como abuso, violencia, trauma o pánico. Los ejercicios de reformulación no son adecuados para ellos si se hacen a solas. Un psicólogo o terapeuta con experiencia en trauma puede acompañarte con seguridad.'),
risk_note:L('Detectarea pe cuvinte este imperfectă; dacă te simți în pericol, contactează serviciile de urgență.','Word-based detection is imperfect; if you feel in danger, contact emergency services.','La detección por palabras es imperfecta; si te sientes en peligro, contacta con los servicios de emergencia.'),

cx_notext:L('Fără text, văd doar numerele. Scrie câteva rânduri ca să le pot încrucișa cu limbajul tău.','Without text, I only see the numbers. Write a few lines so I can cross them with your language.','Sin texto solo veo los números. Escribe unas líneas para cruzarlos con tu lenguaje.'),

cx_hit:L('<b>{theme}</b>: apare în cuvintele tale, iar {role} {n} ({kw}) înclină simbolic spre ea. Ipoteză de testat: {shadow} Prima întrebare de încercat: „{q}”','<b>{theme}</b>: it shows in your words, and your {role} {n} ({kw}) leans, symbolically, toward it. Hypothesis to test: {shadow} First question to try: "{q}"','<b>{theme}</b>: aparece en tus palabras, y tu {role} {n} ({kw}) se inclina, simbólicamente, hacia ella. Hipótesis por probar: {shadow} Primera pregunta para probar: "{q}"'),
cx_sit_t:L('Teme situaționale','Situational themes','Temas situacionales'),

cx_blind_t:L('Puncte oarbe posibile','Possible blind spots','Posibles puntos ciegos'),
cx_blind_p:L('Numerele tale sugerează aceste teme, dar textul nu le menționează. Verifică dacă se potrivesc, fără să le presupui.','Your numbers suggest these themes, but the text does not mention them. Check whether they fit, without assuming it.','Tus números sugieren estos temas, pero el texto no los menciona. Comprueba si encajan, sin darlo por hecho.'),
cx_blind_nt:L('Fără text, acestea sunt doar tendințele simbolice ale numerelor tale. Scrie câteva rânduri ca să vezi dacă se confirmă.','Without text, these are only the symbolic tendencies of your numbers. Write a few lines to see whether they are confirmed.','Sin texto, estas son solo las tendencias simbólicas de tus números. Escribe unas líneas para ver si se confirman.'),
cx_blind:L('<b>{theme}</b>: {role} {n} sugerează să o urmărești, deși textul nu o menționează. Verificare opțională: „{q}”','<b>{theme}</b>: your {role} {n} suggests watching for it, though the text does not mention it. Optional check: "{q}"','<b>{theme}</b>: tu {role} {n} sugiere vigilarla, aunque el texto no la menciona. Comprobación opcional: "{q}"'),

ab_not_t:L('Ce nu este','What it is not','Lo que no es'),
ab_not_p:L('Nu este diagnostic, tratament, terapie sau predicție. Numerologia este un sistem simbolic fără validare științifică. Un consultant care folosește instrumentul răspunde de propriile afirmații; instrumentul oferă întrebări și ipoteze, nu certitudini.','It is not a diagnosis, treatment, therapy or prediction. Numerology is a symbolic system without scientific validation. A consultant using the tool is responsible for their own statements; the tool offers questions and hypotheses, not certainties.','No es un diagnóstico, tratamiento, terapia ni predicción. La numerología es un sistema simbólico sin validación científica. Un consultor que use la herramienta responde de sus propias afirmaciones; la herramienta ofrece preguntas e hipótesis, no certezas.'),
ab_method_t:L('Metoda numerologică','Numerology method','Método numerológico'),
ab_method_p:L('Sistem pitagorean tradițional: valori A-Z de la 1 la 9, reducere prin însumarea cifrelor, numerele maestre 11, 22 și 33 păstrate. Drumul vieții reduce separat ziua, luna și anul, apoi însumează. Interpretările sunt formulate original pentru acest instrument.','Traditional Pythagorean system: A-Z values from 1 to 9, reduction by adding digits, master numbers 11, 22 and 33 kept. Life Path reduces day, month and year separately, then adds them. The interpretations are worded originally for this tool.','Sistema pitagórico tradicional: valores A-Z de 1 a 9, reducción sumando dígitos, números maestros 11, 22 y 33 conservados. El Camino de vida reduce por separado día, mes y año y luego los suma. Las interpretaciones están redactadas originalmente para esta herramienta.'),
ab_nlp_t:L('Metoda NLP (SFLOW)','NLP method (SFLOW)','Método PNL (SFLOW)'),
ab_nlp_p:L('SFLOW este un model educațional creat pentru acest instrument, inspirat de ideile Meta-Modelului din NLP, nu un protocol clinic sau oficial. Potrivirea cuvintelor cheie este euristică; asocierile dintre numere și teme sunt ipoteze ale instrumentului, nu fapte demonstrate.','SFLOW is an educational model created for this tool, inspired by NLP Meta-Model ideas; it is not a clinical or official protocol. Keyword matching is heuristic; the links between numbers and themes are this tool\'s hypotheses, not demonstrated facts.','SFLOW es un modelo educativo creado para esta herramienta, inspirado en ideas del Metamodelo de la PNL; no es un protocolo clínico ni oficial. La coincidencia de palabras clave es heurística; los vínculos entre números y temas son hipótesis de la herramienta, no hechos demostrados.'),

/* Reading layer: works on ANY free text, even when no theme keyword is present.
   Adds: the "stuck" theme, extra theme keywords, emotional tone, life areas,
   contrast / lack detection, a universal fallback course and the strings for them.
   Keywords are normalized (lowercase, no diacritics); prefix match; $ = whole word. */

THEMES.stuck={
 name:L('Blocaj și speranță fragilă','Feeling stuck, fragile hope','Bloqueo y esperanza frágil'),
 desc:L('Situația pare să continue fără schimbare, iar speranța există, dar e mică. Și blocajul, și speranța sunt reale.','The situation seems to go on without change, and hope exists but is small. Both the stuck feeling and the hope are real.','La situación parece seguir sin cambio y la esperanza existe, pero es pequeña. Tanto el bloqueo como la esperanza son reales.'),
 kw:K(['fara sfarsit','nu se termina','nu se schimba','nicio schimbare','nu avansez','nu merge','nu progres*','stagn*','aceeasi situatie','situatia continua','ma invart in cerc','fara iesire','fara perspectiv*','nu vad solutie','nimic nu se schimba','tot la fel','fara rezultat*','degeaba','zadarnic','nu se intampla nimic','nu duce nicaieri','nu ajung nicaieri','fara viitor'],
      ['endless','never ending','no end','not changing','no change','no progress','going nowhere','same situation','keeps going','keeps happening','in circles','no way out','no solution','nothing changes','nothing happens','no results','pointless','in vain','stagnant','dead end','going anywhere','get anywhere','getting anywhere','never end','will never end','no way forward','no future'],
      ['sin fin','interminable','no termina','no cambia','ningun cambio','sin avance','no avanzo','estancad*','misma situacion','situacion continua','en circulos','sin salida','sin solucion','nada cambia','sin resultados','en vano','callejon sin salida','nada pasa','no llevo a ningun lado','sin futuro']),
 watch:L('Observă când apare gândul „nu se schimbă nimic” și ce ai făcut sau n-ai făcut în ziua aceea.','Notice when the thought "nothing changes" shows up and what you did or did not do that day.','Observa cuándo aparece el pensamiento "nada cambia" y qué hiciste o no hiciste ese día.'),
 focus:L('Micșorează scara: caută cel mai mic progres vizibil în 7 zile și ține o evidență a lui, ca speranța mică să aibă dovezi.','Shrink the scale: look for the smallest visible progress in 7 days and keep a record of it, so a small hope has evidence.','Reduce la escala: busca el avance visible más pequeño en 7 días y llévalo por escrito, para que la esperanza pequeña tenga pruebas.'),
 q:L(['Dacă speranța ta ar avea o cifră de la 1 la 10, care e azi și ce ar adăuga un singur punct?','Ce s-a mișcat, oricât de puțin, în ultimele 30 de zile?','Ce parte din situație depinde de mine săptămâna asta și ce parte nu?'],
     ['If your hope had a number from 1 to 10, what is it today and what would add one single point?','What has moved, however little, in the last 30 days?','Which part of this situation depends on me this week, and which part does not?'],
     ['Si tu esperanza tuviera un número del 1 al 10, ¿cuál es hoy y qué sumaría un solo punto?','¿Qué se ha movido, por poco que sea, en los últimos 30 días?','¿Qué parte de la situación depende de mí esta semana y cuál no?']),
 reframe:L('O speranță mică nu e o speranță falsă. E un început care are nevoie de dovezi mici, nu de motivație mare.','A small hope is not a false hope. It is a beginning that needs small proof, not big motivation.','Una esperanza pequeña no es una esperanza falsa. Es un comienzo que necesita pruebas pequeñas, no una gran motivación.'),
 exp:L('Alege un singur pas de 10 minute în domeniul care te doare cel mai tare și notează seara ce ai făcut, oricât de mic.','Pick one 10-minute step in the area that hurts most and write down in the evening what you did, however small.','Elige un solo paso de 10 minutos en el área que más duele y anota por la noche lo que hiciste, por pequeño que sea.'),
 avoid:L('Nu cere de la tine o schimbare mare dintr-odată și nu te compara cu cei care par să reușească. Dacă starea de apăsare durează peste două săptămâni, vorbește cu un medic sau un psiholog.','Do not demand a big change all at once and do not compare yourself with people who seem to succeed. If the heavy mood lasts more than two weeks, talk to a doctor or a psychologist.','No te exijas un gran cambio de golpe ni te compares con quienes parecen triunfar. Si el ánimo pesado dura más de dos semanas, habla con un médico o un psicólogo.')};

THEMES.universal={
 name:L('Un început simplu','A simple start','Un comienzo simple'),

 focus:L('Numește situația în două propoziții: ce se întâmplă și ce ai vrea să se întâmple în loc. Diferența dintre ele e direcția ta.','Name the situation in two sentences: what is happening and what you would like to happen instead. The gap between them is your direction.','Nombra la situación en dos frases: qué ocurre y qué te gustaría que ocurriera en su lugar. La diferencia entre ambas es tu dirección.'),
 q:L(['Care e cel mai mic lucru din situație pe care îl pot influența azi?','Când a fost, chiar și o singură dată, mai ușor? Ce era diferit?','Ce i-aș spune unui prieten aflat în locul meu?'],
     ['What is the smallest part of this situation I can influence today?','When was it, even once, a little easier? What was different?','What would I tell a friend in my place?'],

 reframe:L('Nu trebuie să știu exact ce simt ca să fac primul pas; pasul mic mă ajută să aflu.','I do not need to know exactly what I feel to take the first step; the small step helps me find out.','No necesito saber exactamente lo que siento para dar el primer paso; el paso pequeño me ayuda a averiguarlo.'),
 exp:L('Alege o singură acțiune de 10 minute legată de situație și notează seara ce s-a schimbat în starea ta, oricât de puțin.','Choose one 10-minute action related to the situation and note in the evening what changed in your state, however little.','Elige una sola acción de 10 minutos relacionada con la situación y anota por la noche qué cambió en tu estado, por poco que sea.'),
 avoid:L('Nu căuta răspunsul perfect dintr-o dată; un tipar se vede după câteva zile de observație, nu după o oră de gândit.','Do not look for the perfect answer at once; a pattern shows after a few days of observation, not after an hour of thinking.','No busques la respuesta perfecta de golpe; un patrón se ve tras varios días de observación, no tras una hora de pensar.')};

rd_t:L('Ce citesc în textul tău','What I read in your text','Lo que leo en tu texto'),
rd_p:L('Nu e nevoie să folosești cuvinte anume. Citesc tonul, zonele de viață și felul în care e construit textul.','You do not need to use specific words. I read the tone, the areas of life and how the text is built.','No hace falta usar palabras concretas. Leo el tono, las áreas de la vida y cómo está construido el texto.'),
rd_tone_mixed:L('Textul poartă două lucruri deodată: greutate ({neg}) și speranță ({pos}). Ambele sunt reale, iar planul de mai jos le ține pe amândouă.','The text carries two things at once: heaviness ({neg}) and hope ({pos}). Both are real, and the plan below holds both.','El texto lleva dos cosas a la vez: pesadez ({neg}) y esperanza ({pos}). Ambas son reales, y el plan de abajo sostiene las dos.'),
rd_tone_heavy:L('Citesc mai ales greutate ({neg}). Contează tonul, nu cuvintele alese, și planul pornește de la el.','I mostly read heaviness ({neg}). The tone matters more than the words you chose, and the plan starts from it.','Leo sobre todo pesadez ({neg}). Importa el tono, no las palabras elegidas, y el plan parte de él.'),
rd_tone_positive:L('Citesc o direcție spre mai bine ({pos}). Planul de mai jos o transformă în pași mici.','I read a direction toward something better ({pos}). The plan below turns it into small steps.','Leo una dirección hacia algo mejor ({pos}). El plan de abajo la convierte en pasos pequeños.'),
rd_tone_neutral:L('Textul descrie mai mult o situație decât o stare. Îl citesc așa cum e scris și îți propun întrebările de mai jos.','The text describes a situation more than a feeling. I read it as written and offer the questions below.','El texto describe más una situación que un estado. Lo leo tal como está escrito y te propongo las preguntas de abajo.'),
rd_dom:L('Zone de viață pomenite:','Areas of life mentioned:','Áreas de la vida mencionadas:'),
rd_mirror:L('Întrebări din propriile tale cuvinte','Questions from your own words','Preguntas desde tus propias palabras'),
rd_low_note:L('Dacă starea de apăsare ține de mai mult de două săptămâni sau îți afectează somnul, mâncatul ori munca, merită discutată cu medicul de familie sau cu un psiholog. Aici e doar un instrument de reflecție, nu un diagnostic.','If the heavy mood lasts more than two weeks or affects your sleep, eating or work, it is worth talking to a family doctor or a psychologist. This is only a reflection tool, not a diagnosis.','Si el ánimo pesado dura más de dos semanas o afecta tu sueño, tu alimentación o tu trabajo, conviene hablarlo con un médico de familia o un psicólogo. Esto es solo una herramienta de reflexión, no un diagnóstico.'),
rd_univ:L('Nu am găsit o temă anume, dar asta nu e o problemă. Planul de mai jos funcționează pentru orice situație: pornește de la ce ai scris și o transformă într-un experiment mic.','I did not find one specific theme, and that is fine. The plan below works for any situation: it starts from what you wrote and turns it into a small experiment.','No encontré un tema concreto y no pasa nada. El plan de abajo sirve para cualquier situación: parte de lo que escribiste y lo convierte en un pequeño experimento.'),
mr_lack:L('Spui că nu ai „{x}”. Cum ai ști, concret, că a apărut măcar 10% din el? Ce ai vedea sau ai face diferit într-o zi obișnuită?','You say you lack "{x}". How would you know, concretely, that even 10% of it had appeared? What would you see or do differently on an ordinary day?','Dices que te falta "{x}". ¿Cómo sabrías, en concreto, que ha aparecido al menos un 10 %? ¿Qué verías o harías distinto en un día normal?'),
mr_contrast:L('În aceeași frază ții două lucruri: „{a}” și „{b}”. Ce are nevoie fiecare dintre ele ca să fie luat în serios, fără ca celălalt să-l anuleze?','In the same sentence you hold two things: "{a}" and "{b}". What does each one need to be taken seriously without the other cancelling it?','En la misma frase sostienes dos cosas: "{a}" y "{b}". ¿Qué necesita cada una para tomarse en serio sin que la otra la anule?'),
mr_dur:L('Scrii „{x}”. A fost vreo perioadă, chiar scurtă, în care a fost altfel sau măcar mai ușor? Ce era diferit atunci?','You write "{x}". Was there a period, even a short one, when it was different or at least easier? What was different then?','Escribes "{x}". ¿Hubo algún periodo, aunque breve, en que fue distinto o al menos más fácil? ¿Qué era distinto entonces?'),
mr_hope:L('Pomenești „{x}”. Dacă speranța ta ar avea o cifră de la 1 la 10, care e azi? Ce ar adăuga un singur punct?','You mention "{x}". If your hope had a number from 1 to 10, what is it today? What would add one single point?','Mencionas "{x}". Si tu esperanza tuviera un número del 1 al 10, ¿cuál es hoy? ¿Qué sumaría un solo punto?'),
mr_low:L('Spui „{x}”. Unde simți asta în corp și când e mai ușor, chiar și puțin? Ce faci sau cine e lângă tine atunci?','You say "{x}". Where do you feel this in your body and when is it a little lighter? What are you doing, or who is with you, then?','Dices "{x}". ¿Dónde lo sientes en el cuerpo y cuándo pesa un poco menos? ¿Qué haces o quién está contigo entonces?'),
mr_anx:L('Spui „{x}”. Care e cel mai probabil scenariu, nu cel mai rău, și ce poți face în următoarele 24 de ore?','You say "{x}". What is the most likely scenario, not the worst, and what can you do in the next 24 hours?','Dices "{x}". ¿Cuál es el escenario más probable, no el peor, y qué puedes hacer en las próximas 24 horas?'),
mr_anger:L('Spui „{x}”. Ce valoare sau limită a ta a fost atinsă? Ce ai vrea să se întâmple în loc?','You say "{x}". Which value or limit of yours was touched? What would you want to happen instead?','Dices "{x}". ¿Qué valor o límite tuyo fue tocado? ¿Qué te gustaría que pasara en su lugar?'),
mr_dom:L('Ai pomenit {areas}. Dacă ar trebui să alegi o zonă în care un progres mic ar schimba cel mai mult starea ta generală, care ar fi?','You mentioned {areas}. If you had to pick one area where a small step forward would change your overall state the most, which would it be?','Mencionaste {areas}. Si tuvieras que elegir un área donde un pequeño avance cambiaría más tu estado general, ¿cuál sería?'),
mr_none:L('Descrie ultima dată când ai simțit asta: unde erai, cu cine, ce ți-ai spus în minte. Un episod concret îmi arată mai mult decât orice etichetă.','Describe the last time you felt this: where you were, who was there, what you told yourself. One concrete episode shows more than any label.','Describe la última vez que lo sentiste: dónde estabas, con quién, qué te dijiste. Un episodio concreto muestra más que cualquier etiqueta.'),

{id:'lifepath',g:'num',t:L('Drumul vieții','Life Path','Camino de vida'),m:L(['drumul vieții','drumul vietii','numărul drumului vieții'],['life path'],['camino de vida']),
 d:L('Numărul calculat din data nașterii (zi, lună și an reduse separat, apoi însumate). Descrie tema de fond a parcursului, ca ipoteză de reflecție.','The number calculated from the birth date (day, month and year reduced separately, then added). It describes the background theme of a path, as a hypothesis for reflection.','El número calculado a partir de la fecha de nacimiento (día, mes y año reducidos por separado y luego sumados). Describe el tema de fondo del recorrido, como hipótesis de reflexión.')},
{id:'birthday',g:'num',t:L('Numărul zilei de naștere','Birthday number','Número del día de nacimiento'),m:L(['numărul zilei de naștere','ziua de naștere redusă'],['birthday number'],['número del día de nacimiento']),
 d:L('Ziua nașterii redusă la o cifră. Se citește ca un talent sau un stil de lucru „de zi cu zi”.','The day of birth reduced to one digit. It is read as an everyday talent or working style.','El día de nacimiento reducido a un dígito. Se lee como un talento o estilo de trabajo cotidiano.')},
{id:'expression',g:'num',t:L('Expresie (nume)','Expression (name)','Expresión (nombre)'),m:L(['numărul de expresie','expresie (nume)','numărul expresiei'],['expression number','expression (name)'],['número de expresión','expresión (nombre)']),
 d:L('Suma valorilor tuturor literelor numelui complet. Se citește ca felul în care îți exprimi potențialul în lume.','The sum of the values of all letters in the full name. It is read as the way you express your potential in the world.','La suma de los valores de todas las letras del nombre completo. Se lee como la forma en que expresas tu potencial en el mundo.')},
{id:'soul',g:'num',t:L('Impuls interior','Soul Urge','Impulso interior'),m:L(['impuls interior','impulsul interior','impulsul sufletului'],['soul urge','heart\'s desire'],['impulso interior','impulso del alma']),
 d:L('Suma vocalelor din nume. Se citește ca dorința de fond, ce vrei „înăuntru”, indiferent de ce arăți.','The sum of the vowels in the name. It is read as the underlying wish, what you want "inside", whatever you show.','La suma de las vocales del nombre. Se lee como el deseo de fondo, lo que quieres "por dentro", muestres lo que muestres.')},
{id:'personality',g:'num',t:L('Personalitate (număr)','Personality (number)','Personalidad (número)'),m:L(['numărul personalității','personalitate (număr)'],['personality number'],['número de personalidad']),
 d:L('Suma consoanelor din nume. Se citește ca imaginea pe care o văd ceilalți la prima întâlnire.','The sum of the consonants in the name. It is read as the image others see at first meeting.','La suma de las consonantes del nombre. Se lee como la imagen que ven los demás en el primer encuentro.')},
{id:'maturity',g:'num',t:L('Maturitate','Maturity','Madurez'),m:L(['numărul maturității','număr de maturitate'],['maturity number'],['número de madurez']),
 d:L('Drumul vieții plus Expresia, reduse. Se citește ca direcția spre care tinzi mai ales după 35-40 de ani.','Life Path plus Expression, reduced. It is read as the direction you lean toward, mostly after 35-40.','Camino de vida más Expresión, reducidos. Se lee como la dirección hacia la que tiendes sobre todo después de los 35-40 años.')},
{id:'personalyear',g:'num',t:L('An personal','Personal Year','Año personal'),m:L(['anul personal','an personal'],['personal year'],['año personal']),
 d:L('Ziua și luna nașterii plus anul curent, reduse la o cifră de la 1 la 9. Marchează poziția ta într-un ciclu de 9 ani.','Birth day and month plus the current year, reduced to a digit from 1 to 9. It marks your position in a 9-year cycle.','Día y mes de nacimiento más el año en curso, reducidos a un dígito del 1 al 9. Marca tu posición en un ciclo de 9 años.')},
{id:'personalmonth',g:'num',t:L('Lună personală și zi personală','Personal Month and Personal Day','Mes personal y día personal'),m:L(['luna personală','lunile personale','ziua personală'],['personal month','personal months','personal day'],['mes personal','meses personales','día personal']),
 d:L('Anul personal plus luna calendaristică (și apoi plus ziua), reduse la o cifră. Servesc ca teme de planificare, nu ca predicții.','The personal year plus the calendar month (and then plus the day), reduced to a digit. They serve as planning themes, not predictions.','El año personal más el mes del calendario (y luego más el día), reducidos a un dígito. Sirven como temas de planificación, no como predicciones.')},
{id:'cycle9',g:'num',t:L('Ciclul de 9 ani','The 9-year cycle','El ciclo de 9 años'),m:L(['ciclul de 9 ani','ciclu de 9 ani'],['9-year cycle','nine-year cycle'],['ciclo de 9 años','ciclo de nueve años']),
 d:L('Succesiunea anilor personali 1-9: începe (1), construiește (4), schimbă (5) și încheie (9). Apoi ciclul reîncepe.','The sequence of personal years 1-9: begin (1), build (4), change (5) and close (9). Then the cycle starts again.','La sucesión de años personales 1-9: empezar (1), construir (4), cambiar (5) y cerrar (9). Luego el ciclo vuelve a empezar.')},
{id:'pinnacle',g:'num',t:L('Perioade de viață (piscuri)','Life periods (pinnacles)','Periodos de vida (cimas)'),m:L(['perioadele de viață','perioade de viață','piscuri','pisc'],['life periods','pinnacles','pinnacle'],['periodos de vida','cimas','cima']),
 d:L('Patru etape ale vieții, fiecare cu un număr calculat din data nașterii. Fiecare etapă are o temă și o provocare.','Four stages of life, each with a number calculated from the birth date. Each stage has a theme and a challenge.','Cuatro etapas de la vida, cada una con un número calculado a partir de la fecha de nacimiento. Cada etapa tiene un tema y un desafío.')},
{id:'challenge',g:'num',t:L('Provocare (numerologie)','Challenge (numerology)','Desafío (numerología)'),m:L(['provocările','provocarea','provocări'],['challenges'],['los desafíos','desafíos']),
 d:L('Diferența dintre numere ale datei de naștere. Arată unde este nevoie de efort deliberat în fiecare perioadă de viață.','The difference between numbers of the birth date. It shows where deliberate effort is needed in each life period.','La diferencia entre números de la fecha de nacimiento. Muestra dónde hace falta esfuerzo deliberado en cada periodo de la vida.')},
{id:'symbolic',g:'num',t:L('Previziune simbolică','Symbolic forecast','Previsión simbólica'),m:L(['previziuni simbolice','previziune simbolică'],['symbolic forecasts','symbolic forecast'],['previsiones simbólicas','previsión simbólica']),
 d:L('Un calendar de teme de planificare derivat din numerele tale. Nu prezice evenimente; propune unghiuri de reflecție pentru fiecare perioadă.','A calendar of planning themes derived from your numbers. It does not predict events; it proposes angles of reflection for each period.','Un calendario de temas de planificación derivado de tus números. No predice sucesos; propone ángulos de reflexión para cada periodo.')},

{id:'nlp',g:'nlp',t:L('NLP (programare neuro-lingvistică)','NLP (neuro-linguistic programming)','PNL (programación neurolingüística)'),m:L(['programare neuro-lingvistică'],['neuro-linguistic programming'],['programación neurolingüística']),
 d:L('Un set de metode de comunicare și schimbare personală. Dovezile științifice pentru eficiența lui sunt limitate; aici îl folosim ca instrument de observare a limbajului și de formulare a întrebărilor.','A set of communication and personal-change methods. Scientific evidence for its effectiveness is limited; here it is used as a tool for observing language and framing questions.','Un conjunto de métodos de comunicación y cambio personal. La evidencia científica sobre su eficacia es limitada; aquí se usa como herramienta para observar el lenguaje y formular preguntas.')},
{id:'pattern',g:'nlp',t:L('Tipar (pattern)','Pattern','Patrón'),m:L(['tipar','tipare','tiparul','tiparele','pattern'],['pattern','patterns'],['patrón','patrones']),
 d:L('Un mod care se repetă de a gândi, a simți sau a reacționa într-un anumit tip de situație. Se observă prin repetiție, nu dintr-un singur episod.','A repeating way of thinking, feeling or reacting in a certain kind of situation. It is seen through repetition, not from a single episode.','Una forma repetida de pensar, sentir o reaccionar en cierto tipo de situación. Se observa por repetición, no a partir de un solo episodio.')},
{id:'theme',g:'nlp',t:L('Temă','Theme','Tema'),m:L([],[],[]),
 d:L('Una dintre cele 13 familii de tipare din aplicație (de exemplu perfecționism, frica de respingere sau blocaj). Fiecare are accent, întrebări și un curs de 7 zile.','One of the 13 pattern families in the app (for example perfectionism, fear of rejection or feeling stuck). Each has a focus, questions and a 7-day course.','Una de las 13 familias de patrones de la aplicación (por ejemplo perfeccionismo, miedo al rechazo o bloqueo). Cada una tiene un énfasis, preguntas y un curso de 7 días.')},
{id:'keyword',g:'nlp',t:L('Cuvânt cheie','Keyword','Palabra clave'),m:L(['cuvinte cheie','cuvânt cheie','cuvintele cheie'],['keywords','keyword'],['palabras clave','palabra clave']),
 d:L('Un cuvânt sau o expresie care indică o temă. Nu e obligatoriu: aplicația citește și tonul și zonele de viață, deci funcționează și fără cuvinte anume.','A word or phrase that points to a theme. It is not required: the app also reads the tone and the areas of life, so it works without specific words.','Una palabra o expresión que apunta a un tema. No es obligatoria: la aplicación también lee el tono y las áreas de la vida, así que funciona sin palabras concretas.')},
{id:'signal',g:'nlp',t:L('Semnal (slab, mediu, puternic)','Signal (weak, medium, strong)','Señal (débil, media, fuerte)'),m:L(['semnal puternic','semnal mediu','semnal slab','semnalul'],['strong signal','medium signal','weak signal'],['señal fuerte','señal media','señal débil']),
 d:L('Cât de bine se potrivește o temă cu textul tău. Nu măsoară gravitatea și nu este un diagnostic.','How well a theme fits your text. It does not measure severity and is not a diagnosis.','Cuánto encaja un tema con tu texto. No mide la gravedad y no es un diagnóstico.')},
{id:'tone',g:'nlp',t:L('Ton emoțional','Emotional tone','Tono emocional'),m:L(['ton emoțional'],['emotional tone'],['tono emocional']),
 d:L('Starea care se simte în text: greutate, neliniște, furie sau speranță. Aplicația le citește chiar dacă nu le numești.','The mood felt in the text: heaviness, unease, anger or hope. The app reads them even if you do not name them.','El estado que se siente en el texto: pesadez, inquietud, enojo o esperanza. La aplicación los lee aunque no los nombres.')},
{id:'metamodel',g:'nlp',t:L('Meta-model (tipare de limbaj)','Meta-Model (language patterns)','Metamodelo (patrones de lenguaje)'),m:L(['meta-model','tiparele de limbaj','tipare de limbaj'],['meta-model','language patterns'],['metamodelo','patrones de lenguaje']),
 d:L('Cuvinte care generalizează, obligă sau limitează („mereu”, „trebuie”, „nu pot”). Fiecare vine cu întrebări de precizare care redeschid opțiunile.','Words that generalize, oblige or limit ("always", "must", "cannot"). Each comes with clarifying questions that reopen options.','Palabras que generalizan, obligan o limitan ("siempre", "debo", "no puedo"). Cada una viene con preguntas de precisión que reabren opciones.')},
{id:'reframe',g:'nlp',t:L('Reîncadrare (reframing)','Reframing','Reencuadre'),m:L(['reîncadrare','reîncadrarea','reformulare'],['reframing','reframe'],['reencuadre','reencuadrar']),
 d:L('A privi aceeași situație dintr-un unghi nou, fără a o nega. Este o ipoteză de încercat, nu o formulă de gândire pozitivă.','Looking at the same situation from a new angle, without denying it. It is a hypothesis to try, not a positive-thinking formula.','Mirar la misma situación desde un ángulo nuevo, sin negarla. Es una hipótesis para probar, no una fórmula de pensamiento positivo.')},
{id:'experiment',g:'nlp',t:L('Experiment mic','Small experiment','Experimento pequeño'),m:L(['experiment mic','experimentul','experimente mici'],['small experiment','the experiment'],['experimento pequeño','el experimento']),
 d:L('O acțiune mică, reversibilă și de scurtă durată, făcută ca să afli ce se întâmplă cu adevărat, nu ca să dovedești ceva.','A small, reversible, short action taken to find out what really happens, not to prove something.','Una acción pequeña, reversible y breve, hecha para averiguar qué ocurre de verdad y no para demostrar algo.')},
{id:'sflow',g:'nlp',t:L('Cursul SFLOW','SFLOW course','Curso SFLOW'),m:L(['SFLOW','cursul de 7 zile','curs de 7 zile'],['SFLOW','7-day course'],['SFLOW','curso de 7 días']),

{id:'cross',g:'tool',t:L('Profil încrucișat','Cross profile','Perfil cruzado'),m:L(['profil încrucișat','profilul încrucișat','analiza încrucișată'],['cross profile','cross analysis'],['perfil cruzado','análisis cruzado']),

{id:'resonance',g:'tool',t:L('Rezonanță','Resonance','Resonancia'),m:L(['rezonanță','rezonanțe'],['resonance','resonances'],['resonancia','resonancias']),

{id:'blindspot',g:'tool',t:L('Punct orb','Blind spot','Punto ciego'),m:L(['puncte oarbe','punct orb','puncte oarbe posibile'],['blind spots','blind spot','possible blind spots'],['puntos ciegos','punto ciego']),

{id:'hypothesis',g:'tool',t:L('Ipoteză','Hypothesis','Hipótesis'),m:L(['ipoteză','ipoteze','ipotezele'],['hypothesis','hypotheses'],['hipótesis']),
 d:L('Tot ce produce aplicația este o ipoteză de verificat în viața ta reală. Tu decizi ce se potrivește și ce nu.','Everything the app produces is a hypothesis to check in your real life. You decide what fits and what does not.','Todo lo que produce la aplicación es una hipótesis para comprobar en tu vida real. Tú decides qué encaja y qué no.')},
{id:'profile',g:'tool',t:L('Profil de client','Client profile','Perfil de cliente'),m:L(['profilul tău','profil de client','profilul de client'],['your profile','client profile'],['tu perfil','perfil de cliente']),
 d:L('Numele, data nașterii și, opțional, adresa de e-mail, salvate doar pe dispozitivul tău ca să nu le reintroduci. Se poate exporta și șterge oricând.','Your name, birth date and, optionally, e-mail address, saved only on your device so you do not retype them. It can be exported and deleted at any time.','Tu nombre, fecha de nacimiento y, opcionalmente, tu correo, guardados solo en tu dispositivo para no reescribirlos. Se puede exportar y borrar en cualquier momento.')},
{id:'checkin',g:'tool',t:L('Check-in','Check-in','Check-in'),m:L(['check-in','check-in-uri','check-in-ul'],['check-in','check-ins'],['check-in','check-ins']),
 d:L('O notare scurtă (două minute) cu starea, intensitatea temei și pasul făcut. Din check-in-uri se construiește evoluția ta.','A short entry (two minutes) with mood, theme intensity and the step done. Your evolution is built from check-ins.','Una anotación breve (dos minutos) con el ánimo, la intensidad del tema y el paso dado. Tu evolución se construye con los check-ins.')},
{id:'evolution',g:'tool',t:L('Evoluție','Evolution','Evolución'),m:L(['evoluția','evoluție'],['evolution'],['evolución']),
 d:L('Traseul stării tale în timp, așa cum rezultă din check-in-uri: grafic, tendință și etapa în care te afli.','The path of your state over time, as shown by check-ins: chart, trend and the stage you are in.','El recorrido de tu estado en el tiempo, según los check-ins: gráfico, tendencia y la etapa en que te encuentras.')},
{id:'stage',g:'tool',t:L('Etapă','Stage','Etapa'),m:L([],[],[]),

{id:'package',g:'tool',t:L('Pachet','Package','Paquete'),m:L(['pachet','pachete','pachetul','pachetele'],['package','packages'],['paquete','paquetes']),

{id:'code',g:'tool',t:L('Cod de activare','Activation code','Código de activación'),m:L(['cod de activare','codul de activare','codul primit'],['activation code','the code you received'],['código de activación','el código recibido']),

{id:'offline',g:'tool',t:L('Offline și stocare locală','Offline and local storage','Sin conexión y almacenamiento local'),m:L(['stocare locală','funcționează offline','offline'],['local storage','works offline','offline'],['almacenamiento local','funciona sin conexión','sin conexión']),

/* Chapters (trilingual HTML). Tools are inserted with <div data-tool="name"></div>. */
var CHAPTERS=[
/* ===== NUMEROLOGY ===== */
{area:'num',id:'n-intro',
 title:L('Ce este numerologia și ce nu este','What numerology is, and what it is not','Qué es la numerología y qué no es'),
 html:L('<p>Numerologia dă sens simbolic numerelor extrase din data nașterii și din nume. Este o tradiție veche, mai apropiată de o oglindă decât de un instrument de măsură: îți oferă cuvinte și imagini cu care să gândești.</p><p>Nu există dovezi științifice că numerele prezic personalitatea sau evenimentele. O lectură poate însă stârni întrebări pe care poate nu ți le-ai pus, iar unii oameni găsesc asta util.</p><div class="how"><b>Folosește-o așa:</b> citește fiecare descriere ca pe o întrebare („Mi se potrivește? Când?”), păstrează ce se potrivește și lasă restul.</div>',
 '<p>Numerology gives symbolic meaning to numbers taken from your birth date and name. It is an old tradition, closer to a mirror than to a measuring instrument: it gives you words and images to think with.</p><p>There is no scientific evidence that numbers predict personality or events. A reading can, however, prompt questions you might not have asked, and some people find that useful.</p><div class="how"><b>Use it like this:</b> read each description as a question ("Does this fit me? When?"), keep what fits and let the rest go.</div>',
 '<p>La numerología da un significado simbólico a los números extraídos de la fecha de nacimiento y del nombre. Es una tradición antigua, más cercana a un espejo que a un instrumento de medida: te ofrece palabras e imágenes con las que pensar.</p><p>No hay evidencia científica de que los números predigan la personalidad ni los acontecimientos. Una lectura sí puede suscitar preguntas que quizá no te habías hecho, y a algunas personas eso les resulta útil.</p><div class="how"><b>Úsala así:</b> lee cada descripción como una pregunta ("¿Me encaja? ¿Cuándo?"), quédate con lo que encaja y deja el resto.</div>')},
{area:'num',id:'n-method',
 title:L('Cum se calculează numerele','How the numbers are calculated','Cómo se calculan los números'),
 html:L('<p>Instrumentul folosește sistemul pitagorean tradițional.</p><ol><li><b>Literele devin numere.</b> A=1, B=2 ... I=9, apoi J=1 din nou și tot așa (tabelul de mai jos). Diacriticele se ignoră.</li><li><b>Reducerea:</b> aduni cifrele până rămâne una singură: 17 → 1+7 = 8. Numerele maestre 11, 22 și 33 se păstrează: 29 → 2+9 = 11.</li><li><b>Drumul vieții:</b> reduci separat ziua, luna și anul, aduni cele trei rezultate și reduci din nou.</li><li><b>Numărul zilei de naștere:</b> ziua nașterii, redusă.</li><li><b>Expresia:</b> toate literele numelui complet, adunate și reduse. Impulsul interior (vocale) și Personalitatea (consoane) sunt în pachetul Numerologie Deep.</li><li><b>Anul personal:</b> zi + lună + anul curent, redus la 1-9.</li></ol><div data-tool="letters"></div>',
 '<p>This tool uses the traditional Pythagorean system.</p><ol><li><b>Letters become numbers.</b> A=1, B=2 ... I=9, then J=1 again, and so on (table below). Diacritics are ignored.</li><li><b>Reduction:</b> add the digits until one remains: 17 → 1+7 = 8. Master numbers 11, 22 and 33 are kept: 29 → 2+9 = 11.</li><li><b>Life Path:</b> reduce the day, the month and the year separately, add the three results and reduce again.</li><li><b>Birthday number:</b> the day of birth, reduced.</li><li><b>Expression:</b> all letters of the full name, added and reduced. Soul Urge (vowels) and Personality (consonants) are in the Numerology Deep package.</li><li><b>Personal year:</b> day + month + current year, reduced to 1-9.</li></ol><div data-tool="letters"></div>',
 '<p>La herramienta usa el sistema pitagórico tradicional.</p><ol><li><b>Las letras se vuelven números.</b> A=1, B=2 ... I=9, luego J=1 otra vez, y así sucesivamente (tabla de abajo). Se ignoran los diacríticos.</li><li><b>Reducción:</b> se suman los dígitos hasta que queda uno: 17 → 1+7 = 8. Los números maestros 11, 22 y 33 se conservan: 29 → 2+9 = 11.</li><li><b>Camino de vida:</b> reduce por separado el día, el mes y el año, suma los tres resultados y reduce de nuevo.</li><li><b>Número del día de nacimiento:</b> el día de nacimiento, reducido.</li><li><b>Expresión:</b> todas las letras del nombre completo, sumadas y reducidas. El Impulso interior (vocales) y la Personalidad (consonantes) están en el paquete Numerología Deep.</li><li><b>Año personal:</b> día + mes + año actual, reducido a 1-9.</li></ol><div data-tool="letters"></div>')},

{area:'num',id:'n-year',

{area:'num',id:'n-use',
 title:L('Cum folosești bine o lectură','How to use a reading well','Cómo usar bien una lectura'),
 html:L('<ol><li>Tratează descrierile ca pe întrebări, nu ca pe fapte.</li><li>Caută ce e adevărat atât în dar, cât și în umbră; mulți oameni se recunosc în ambele.</li><li>Alege o singură linie de creștere și transform-o într-o acțiune mică, săptămâna aceasta.</li><li>Nu folosi numerele ca să judeci compatibilitatea sau ca să iei decizii mari: loc de muncă, bani, sănătate, relații.</li><li>Verifică după o lună: ce s-a confirmat în viața reală și ce nu.</li></ol>','<ol><li>Treat descriptions as questions, not facts.</li><li>Look for what is true in both the gift and the shadow; many people recognize both.</li><li>Choose one growth line and turn it into a small action this week.</li><li>Do not use numbers to judge compatibility or to make big decisions: job, money, health, relationships.</li><li>Check after a month: what was confirmed in real life, and what was not.</li></ol>','<ol><li>Trata las descripciones como preguntas, no como hechos.</li><li>Busca lo que es cierto tanto en el don como en la sombra; muchas personas se reconocen en ambos.</li><li>Elige una línea de crecimiento y conviértela en una acción pequeña esta semana.</li><li>No uses los números para juzgar la compatibilidad ni para tomar decisiones importantes: trabajo, dinero, salud, relaciones.</li><li>Comprueba después de un mes: qué se confirmó en la vida real y qué no.</li></ol>')},
