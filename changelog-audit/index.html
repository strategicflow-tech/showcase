<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7TV731EJTB"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog Audit — Strategic Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ── BRAND TOKENS — injected dynamically per client ── */
  :root {
    --brand-primary: #FF694A;       /* client accent — scraped or set manually */
    --brand-black:   #0F1117;
    --brand-white:   #FFFFFF;
    --brand-gray-50:  #F9FAFB;
    --brand-gray-100: #F3F4F6;
    --brand-gray-200: #E5E7EB;
    --brand-gray-300: #D1D5DB;
    --brand-gray-500: #6B7280;
    --brand-gray-700: #374151;
    --brand-gray-900: #111827;
    --brand-text:   #111827;
    --brand-muted:  #6B7280;
    --brand-border: #E5E7EB;
    --bug:    #DC2626;
    --bug-bg: #FEF2F2;
    --bug-br: #FECACA;
    --fix:    #059669;
    --fix-bg: #F0FDF4;
    --fix-br: #6EE7B7;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;overflow-x:hidden;}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--brand-white);color:var(--brand-text);font-size:16px;line-height:1.75;}

  /* ══════════════════════════════════════
     HEADER UNIFICAT — un singur bloc negru
     fara rupturi, full viewport width
  ══════════════════════════════════════ */
  .sf-header{
    width:100%;
    background:var(--brand-black);
    position:sticky;top:0;z-index:200;
    /* gradient subtil spre continut */
    box-shadow:0 4px 24px rgba(0,0,0,.35);
  }

  /* Randul 1: branding + scoruri */
  .sf-header-top{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;
    border-bottom:1px solid rgba(255,255,255,.07);
    gap:10px;
  }
  .sf-header-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .sf-badge{
    background:var(--brand-primary);color:#fff;
    font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 10px;border-radius:6px;white-space:nowrap;
  }
  .cl-badge{
    color:rgba(255,255,255,.5);
    font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    white-space:nowrap;
  }
  .sf-header-scores{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .sc{
    padding:5px 10px;border-radius:6px;
    font-size:11px;font-weight:700;white-space:nowrap;
  }
  .sc.bad{background:#DC2626;color:#fff;}
  .sc.good{background:#059669;color:#fff;}

  /* Randul 2: tab-uri Before/After */
  .sf-header-tabs{
    width:100%;
    display:flex;align-items:stretch;
    border-bottom:3px solid var(--brand-primary);
  }
  .tab-btn{
    flex:1;
    padding:12px 20px;border:none;
    background:transparent;
    font-family:inherit;font-size:14px;font-weight:700;
    color:rgba(255,255,255,.35);cursor:pointer;
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    letter-spacing:.01em;
    border-bottom:3px solid transparent;
    margin-bottom:-3px;
  }
  .tab-btn:hover{
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.7);
  }
  .tab-btn.active{
    background:rgba(255,255,255,.06);
    color:#fff;
  }
  .tab-btn.active.before-tab{
    border-bottom-color:var(--bug);
    color:#FF6B6B;
  }
  .tab-btn.active.after-tab{
    border-bottom-color:#00E676;
    color:#69F0AE;
  }
  .tab-dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
  }
  .before-dot{background:var(--bug);}
  .after-dot{background:#00E676;}

  /* ── CLIENT NAV — sub header, alb ── */
  .client-nav{
    width:100%;
    height:52px;
    border-bottom:1px solid var(--brand-border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    background:var(--brand-white);
  }
  .client-logo{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--brand-black);}
  .client-logo span{color:var(--brand-primary);}
  .nav-links{display:flex;gap:24px;font-size:14px;color:var(--brand-gray-700);font-weight:500;}
  .nav-right{display:flex;gap:10px;align-items:center;}
  .btn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:none;}
  .btn-ghost{background:transparent;border:1px solid var(--brand-border);color:var(--brand-text);}
  .btn-primary{background:var(--brand-primary);color:#fff;}

  /* ── PAGE LAYOUT ── */
  .page{max-width:1200px;width:100%;margin:0 auto;padding:48px 20px 80px;display:grid;grid-template-columns:1fr 268px;gap:56px;overflow:hidden;}

  /* ── BREADCRUMB ── */
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand-muted);margin-bottom:20px;}
  .breadcrumb a{color:var(--brand-muted);text-decoration:none;}
  .breadcrumb a:hover{color:var(--brand-primary);}
  .bc-sep{color:var(--brand-gray-300);}

  /* ── ARTICLE TITLE ── */
  .article-title{font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.02em;color:var(--brand-gray-900);margin-bottom:16px;}

  /* ── META ── */
  .article-meta{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--brand-border);font-size:14px;color:var(--brand-muted);}
  .meta-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--brand-gray-200);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--brand-primary);}
  .meta-authors{color:var(--brand-gray-900);font-weight:500;}

  /* ── HERO ── */
  .hero{width:100%;aspect-ratio:16/7;border-radius:8px;overflow:hidden;background:var(--brand-gray-100);margin-bottom:32px;display:flex;align-items:center;justify-content:center;}
  .hero img{width:100%;height:100%;object-fit:cover;}
  .hero-placeholder{font-size:13px;color:var(--brand-muted);}

  /* ── BODY TEXT ── */
  .article-body{font-size:16px;line-height:1.8;color:var(--brand-gray-700);overflow-wrap:break-word;word-break:break-word;min-width:0;}
  .article-body p{margin-bottom:20px;}
  .article-body h2{font-size:24px;font-weight:700;color:var(--brand-gray-900);margin:44px 0 14px;letter-spacing:-.01em;}
  .article-body h3{font-size:20px;font-weight:600;color:var(--brand-gray-900);margin:32px 0 10px;}
  .article-body ul{margin-bottom:20px;padding-left:22px;}
  .article-body ul li{margin-bottom:10px;}
  .article-body a{color:var(--brand-primary);text-decoration:none;}
  .article-body a:hover{text-decoration:underline;}
  .article-body strong{color:var(--brand-gray-900);font-weight:600;}
  .article-body code{background:var(--brand-gray-100);border:1px solid var(--brand-gray-200);border-radius:4px;padding:1px 6px;font-size:14px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--brand-primary);}

  /* ── QUOTE ── */
  .brand-quote{border-left:4px solid var(--brand-primary);padding:14px 20px;background:var(--brand-gray-50);border-radius:0 6px 6px 0;margin:24px 0;font-style:italic;font-size:15px;color:var(--brand-gray-700);line-height:1.65;}
  .brand-quote cite{display:block;font-style:normal;font-size:13px;color:var(--brand-muted);margin-top:8px;}

  /* ── CTA BLOCK ── */
  .cta-block{background:var(--brand-gray-50);border:1px solid var(--brand-border);border-radius:10px;padding:28px 32px;margin:36px 0;}
  .cta-block h3{font-size:18px;font-weight:700;color:var(--brand-gray-900);margin-bottom:8px;}
  .cta-block p{font-size:15px;color:var(--brand-muted);margin-bottom:16px;}

  /* ── DIVIDER ── */
  .divider{border:none;border-top:1px solid var(--brand-border);margin:36px 0;}

  /* ── SF FOOTER ── */
  .sf-footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--brand-border);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--brand-muted);}
  .sf-footer a{color:var(--brand-primary);text-decoration:none;font-weight:500;}

  /* ── BUG ANNOTATIONS ── */
  .bug-text{background:rgba(220,38,38,.07);text-decoration:underline;text-decoration-color:var(--bug);text-decoration-thickness:2px;text-underline-offset:3px;border-radius:2px;padding:0 2px;}
  .bug-num{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--bug);color:#fff;font-size:10px;font-weight:700;vertical-align:super;position:relative;top:-3px;margin-left:3px;cursor:default;}
  .para-bug{border-left:3px solid var(--bug);padding-left:14px;margin-left:0;background:rgba(220,38,38,.03);border-radius:4px;margin-bottom:20px;}
  .para-bug p{margin-bottom:0;}
  .inline-bug{display:inline-flex;align-items:center;gap:4px;background:var(--bug-bg);border:1px solid var(--bug-br);border-radius:4px;padding:1px 8px;font-size:11px;color:var(--bug);font-weight:600;margin-left:6px;white-space:nowrap;vertical-align:middle;}

  /* ── FIX ANNOTATIONS ── */
  .rebuilt-title-block{background:var(--fix-bg);border:1px solid var(--fix-br);border-left:4px solid var(--fix);border-radius:6px;padding:16px 20px;margin-bottom:16px;}
  .rebuilt-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fix);margin-bottom:6px;}
  .rebuilt-title-text{font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.02em;color:var(--brand-gray-900);}
  .rebuilt-para{border-left:3px solid var(--fix);padding-left:14px;margin-left:0;background:rgba(5,150,105,.03);border-radius:4px;margin-bottom:20px;}
  .rebuilt-para p{margin-bottom:0;}
  .inline-fix{display:inline-flex;align-items:center;gap:4px;background:var(--fix-bg);border:1px solid var(--fix-br);border-radius:4px;padding:1px 8px;font-size:11px;color:var(--fix);font-weight:600;margin-left:6px;white-space:nowrap;vertical-align:middle;}

  /* ── STAT CARDS ── */
  .stat-cards{display:flex;gap:12px;margin:20px 0;}
  .stat-card{background:var(--brand-gray-900);color:#fff;border-radius:8px;padding:16px 20px;flex:1;text-align:center;}
  .stat-num{font-size:28px;font-weight:700;color:var(--fix);line-height:1;}
  .stat-label{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}

  /* ── REBUILT CTA BTN ── */
  .rebuilt-cta-btn{display:inline-block;background:var(--fix);color:#fff;padding:11px 22px;border-radius:6px;font-size:15px;font-weight:600;cursor:default;}

  /* ── SIDEBAR ── */
  .sidebar{position:sticky;top:calc(48px + 56px + 24px);height:fit-content;max-height:calc(100vh - 160px);overflow-y:auto;}
  .score-box{background:var(--brand-gray-50);border:1px solid var(--brand-border);border-radius:8px;padding:16px;margin-bottom:20px;}
  .score-box-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-muted);margin-bottom:12px;}
  .score-line{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px solid var(--brand-border);}
  .score-line:last-child{border:none;}
  .score-k{color:var(--brand-muted);}
  .score-v{font-weight:700;}
  .score-v.r{color:var(--bug);}
  .score-v.g{color:var(--fix);}
  .score-v.a{color:#d97706;}
  .sbar{height:4px;background:var(--brand-gray-200);border-radius:2px;margin-top:5px;overflow:hidden;}
  .sfill{height:100%;border-radius:2px;}
  .ann-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-muted);padding-bottom:8px;border-bottom:1px solid var(--brand-border);margin-bottom:10px;}
  .ann-card{border-radius:6px;padding:11px 13px;margin-bottom:9px;border:1px solid;font-size:12px;line-height:1.5;}
  .ann-card.bug{background:var(--bug-bg);border-color:var(--bug-br);}
  .ann-card.fix{background:var(--fix-bg);border-color:var(--fix-br);}
  .ann-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px;margin-bottom:3px;}
  .ann-l.bug{color:var(--bug);}
  .ann-l.fix{color:var(--fix);}
  .ann-circle{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;}
  .ann-circle.bug{background:var(--bug);color:#fff;}
  .ann-circle.fix{background:var(--fix);color:#fff;}
  .ann-title{font-weight:600;color:var(--brand-gray-900);margin-bottom:2px;}
  .ann-body{color:var(--brand-gray-700);font-size:11px;}

  /* ── WHAT CHANGED TABLE ── */
  .wc{background:#0a0a0a;border-radius:12px;padding:32px;margin:36px 0;border:1px solid #1a1a1a;}
  .wc-head{
    font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;
    color:rgba(255,255,255,.3);margin-bottom:24px;
    display:flex;align-items:center;gap:12px;
  }
  .wc-head::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06);}
  .wc-cols{
    display:grid;grid-template-columns:100px 1fr 1fr;gap:16px;
    padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:0;
  }
  .wc-col-h{
    font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  }
  .wc-col-h:nth-child(1){color:rgba(255,255,255,.25);}
  .wc-col-h:nth-child(2){color:#FF4444;text-shadow:0 0 12px rgba(255,68,68,.5);}
  .wc-col-h:nth-child(3){color:#00E676;text-shadow:0 0 12px rgba(0,230,118,.5);}

  .wc-row{
    display:grid;grid-template-columns:100px 1fr 1fr;gap:16px;
    padding:16px 0;border-bottom:1px solid rgba(255,255,255,.04);
    align-items:start;
  }
  .wc-row:last-child{border:none;}

  .wc-fix{
    font-size:10px;font-weight:800;color:rgba(255,255,255,.3);
    text-transform:uppercase;letter-spacing:.08em;line-height:1.5;
    padding-top:3px;
  }

  /* BEFORE cell — dark red tint, red text */
  .wc-b{
    font-size:13px;line-height:1.6;font-weight:500;
    color:#FF6B6B;
    background:rgba(255,68,68,.08);
    border:1px solid rgba(255,68,68,.2);
    border-left:3px solid #FF4444;
    border-radius:0 6px 6px 0;
    padding:10px 14px;
    text-shadow:0 0 20px rgba(255,68,68,.15);
  }

  /* AFTER cell — dark green tint, green text */
  .wc-a{
    font-size:13px;line-height:1.6;font-weight:500;
    color:#69F0AE;
    background:rgba(0,230,118,.08);
    border:1px solid rgba(0,230,118,.2);
    border-left:3px solid #00E676;
    border-radius:0 6px 6px 0;
    padding:10px 14px;
    text-shadow:0 0 20px rgba(0,230,118,.15);
  }

  /* ── BEFORE/AFTER TOGGLE ── */
  .before-only{display:block;}
  .after-only{display:none;}
  body.after-view .before-only{display:none;}
  body.after-view .after-only{display:block;}

  /* ── CHANGELOG ENTRY CARD ── */
  .cl-entry{border:1px solid var(--brand-border);border-radius:10px;overflow:hidden;margin-bottom:24px;}
  .cl-entry-header{padding:16px 20px;background:var(--brand-gray-50);border-bottom:1px solid var(--brand-border);display:flex;align-items:center;justify-content:space-between;}
  .cl-entry-title{font-size:16px;font-weight:600;color:var(--brand-gray-900);}
  .cl-entry-date{font-size:12px;color:var(--brand-muted);}
  .cl-entry-body{padding:20px;}
  .cl-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px;margin-right:6px;margin-bottom:8px;}
  .cl-tag.new{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;}
  .cl-tag.fix{background:var(--fix-bg);color:var(--fix);border:1px solid var(--fix-br);}
  .cl-tag.improved{background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;}

  /* ── BRAND SCRAPER UI ── */
  .scraper-bar{
    background:var(--brand-black);
    border-bottom:3px solid var(--brand-primary);
    padding:16px 20px;
    display:flex;flex-direction:column;gap:10px;
  }
  .scraper-label{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:rgba(255,255,255,.4);
  }
  .scraper-guide{
    font-size:13px;color:rgba(255,255,255,.75);line-height:1.4;
  }
  .scraper-guide strong{color:#fff;}
  .scraper-row{display:flex;align-items:center;gap:10px;width:100%;}
  .scraper-input{
    flex:1;
    padding:11px 14px;
    border:1.5px solid rgba(255,255,255,.15);
    border-radius:8px;
    font-size:14px;font-family:inherit;
    background:rgba(255,255,255,.07);
    color:#fff;outline:none;
    transition:border-color .15s;
  }
  .scraper-input::placeholder{color:rgba(255,255,255,.3);}
  .scraper-input:focus{border-color:var(--brand-primary);}
  .scraper-btn{
    padding:11px 20px;
    background:var(--brand-primary);color:#fff;
    border:none;border-radius:8px;
    font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
    white-space:nowrap;flex-shrink:0;
    transition:opacity .15s;
  }
  .scraper-btn:hover{opacity:.88;}
  .scraper-status{
    font-size:12px;color:rgba(255,255,255,.4);
    font-style:italic;min-height:16px;
  }

  /* ── RESPONSIVE ── */
  @media(max-width:900px){
    .page{grid-template-columns:1fr;gap:32px;}
    .sidebar{position:static;max-height:none;}
    .stat-cards{flex-wrap:wrap;}
    .stat-card{min-width:calc(50% - 6px);}
    .wc-cols,.wc-row{grid-template-columns:80px 1fr 1fr;}
    .nav-links{display:none;}
  }

  @media(max-width:600px){
    *{max-width:100%;}
    .scraper-bar{padding:14px 16px;}
    .scraper-guide{font-size:12px;}
    .scraper-input{font-size:13px;padding:10px 12px;}
    .scraper-btn{font-size:13px;padding:10px 14px;}
    .sf-header-top{padding:10px 16px;}
    .sf-header-scores{gap:6px;}
    .sf-header-tabs .tab-btn{font-size:14px;padding:13px 16px;}
    .cl-badge{display:none;}
    .client-nav{padding:0 14px;height:46px;}
    .nav-links{display:none;}
    .nav-right{gap:6px;}
    .btn{padding:6px 10px;font-size:12px;}
    .page{padding:20px 16px 60px;grid-template-columns:1fr;gap:24px;}
    .sidebar{position:static;max-height:none;}
    .article-title{font-size:22px;word-break:break-word;}
    .inline-bug,.inline-fix{white-space:normal;display:flex;flex-wrap:wrap;width:100%;margin:8px 0 0 0;}
    .wc{padding:16px 14px;overflow:hidden;}
    .wc-cols{display:none;}
    .wc-row{grid-template-columns:1fr;gap:0;border-bottom:1px solid rgba(255,255,255,.08);padding:14px 0;}
    .wc-fix{font-size:9px;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block;}
    .wc-b{font-size:12px;padding:10px 12px;border-radius:6px;margin-bottom:6px;border-left-width:3px;}
    .wc-a{font-size:12px;padding:10px 12px;border-radius:6px;border-left-width:3px;}
    .stat-cards{flex-direction:column;}
    .stat-card{min-width:100%;}
    .cl-entry{overflow:hidden;}
    .cl-entry-header{flex-wrap:wrap;gap:6px;}
  }
</style>
</head>
<body id="body">

<!-- ── BRAND SCRAPER BAR ── -->
<div class="scraper-bar" id="scraperBar">
  <div class="scraper-label">Step 1 — Extract client brand</div>
  <div class="scraper-guide">
    Paste the <strong>changelog URL</strong> of the client below.<br>
    Strategic Flow will extract their brand colors, fonts, and logo automatically.
  </div>
  <div class="scraper-row">
    <input
      class="scraper-input"
      id="brandUrl"
      placeholder="e.g. changelog.linear.app or getdbt.com/blog"
    />
    <button class="scraper-btn" onclick="applyBrand()">Extract Brand</button>
  </div>
  <div class="scraper-status" id="scraperStatus">No brand extracted yet — paste a URL and tap Extract Brand</div>
</div>

<!-- ══════════════════════════════════
     HEADER UNIFICAT Strategic Flow

<header class="sf-header">
